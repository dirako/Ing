/* ===== assets/js/pantallas/02-fundamentos.js ===== */
/* ============================================================
   MÓDULO 2 · FUNDAMENTOS
   Qué es, qué puede hacer, qué no es, de dónde viene y cómo evolucionó.
   ============================================================ */
(function () {
  "use strict";
  window.PANTALLAS = window.PANTALLAS || [];

  /* ---------------------------------------------------------
     P03 · ¿QUÉ ES LA INTELIGENCIA ARTIFICIAL?
     --------------------------------------------------------- */
  var CADENA = [
    { t: "DATOS", s: "Registros, textos, imágenes, mediciones" },
    { t: "ALGORITMOS", s: "Reglas matemáticas de aprendizaje" },
    { t: "PROCESAMIENTO", s: "Entrenamiento y cálculo" },
    { t: "PATRONES", s: "Regularidades que se repiten" },
    { t: "RESULTADOS", s: "Clasificación, predicción, generación" }
  ];

  window.PANTALLAS.push({
    id: "que-es",
    tema: "motor",
    modulo: "Fundamentos · 01",
    titulo: "¿Qué es la Inteligencia Artificial?",
    pregunta: "Primero en palabras sencillas. Después, con precisión técnica.",
    html: function () {
      var pasos = CADENA.map(function (p, i) {
        return (
          '<div class="paso' + (i === CADENA.length - 1 ? " paso--ia" : "") + '">' +
          "<span>" + p.t + "</span><small>" + p.s + "</small></div>" +
          (i < CADENA.length - 1
            ? '<div class="conector"><i class="pulso" style="--pd:' + i * 340 + '"></i></div>'
            : "")
        );
      }).join("");

      return `
      <div class="columna">
        <div class="rejilla" data-col="2" data-rev>
          <div class="tarjeta tarjeta--dest">
            <h3><span class="icono">🗣️</span> En palabras sencillas</h3>
            <p>Es un conjunto de programas que <b>aprenden de ejemplos</b> en lugar de recibir todas las
            instrucciones escritas por una persona. Al ver muchos casos, encuentran regularidades y las
            usan para responder ante casos nuevos.</p>
          </div>
          <div class="tarjeta">
            <h3><span class="icono">📐</span> En términos técnicos</h3>
            <p>Campo de la computación que construye <b>sistemas capaces de ejecutar tareas que
            requieren inferencia</b>: a partir de datos de entrada, un modelo ajustado estadísticamente
            produce salidas —clasificaciones, predicciones o contenido— con un grado de incertidumbre asociado.</p>
          </div>
        </div>

        <div class="flujo-marco" data-rev>
          <div class="flujo">${pasos}</div>
        </div>

        <div class="aviso aviso--clave" data-rev>
          <span class="marca">🔑</span>
          <p style="margin:0">Sin <b>datos</b> no hay inteligencia artificial. La calidad de la salida
          nunca es mejor que la calidad de la información que entró.</p>
        </div>
      </div>`;
    }
  });

  /* ---------------------------------------------------------
     P04 · QUÉ PUEDE HACER
     --------------------------------------------------------- */
  var CAPACIDADES = [
    { i: "🗂️", t: "Clasificación", d: "Asignar una categoría: urgente / no urgente, riesgo alto / bajo." },
    { i: "🔎", t: "Reconocimiento", d: "Identificar objetos, textos, voces o hallazgos en una imagen." },
    { i: "📈", t: "Predicción", d: "Estimar un valor o un evento futuro a partir del histórico." },
    { i: "✍️", t: "Generación", d: "Producir texto, imágenes, audio, código o documentos nuevos." },
    { i: "🎯", t: "Recomendación", d: "Sugerir la siguiente acción más pertinente según el contexto." },
    { i: "💬", t: "Lenguaje", d: "Leer, resumir, traducir y estructurar texto no estructurado." },
    { i: "🧮", t: "Análisis", d: "Detectar anomalías, agrupar casos y explicar comportamientos." }
  ];

  window.PANTALLAS.push({
    id: "capacidades",
    tema: "motor",
    modulo: "Fundamentos · 02",
    titulo: "¿Qué tipo de tareas puede realizar?",
    pregunta: "No es una sola habilidad: es una familia de capacidades que se combinan según el problema.",
    html: function () {
      return (
        '<div class="rejilla" data-col="auto">' +
        CAPACIDADES.map(function (c) {
          return (
            '<div class="tarjeta" data-rev><h3><span class="icono">' + c.i + "</span>" + c.t + "</h3>" +
            "<p>" + c.d + "</p></div>"
          );
        }).join("") +
        "</div>" +
        '<div class="aviso" data-rev><span class="marca">🏥</span><p style="margin:0">' +
        "En una institución de salud rara vez se usa una sola: una alerta de riesgo combina " +
        "<b>análisis + predicción + recomendación</b>, y una respuesta a PQRS combina " +
        "<b>lenguaje + clasificación + generación</b>.</p></div>"
      );
    }
  });

  /* ---------------------------------------------------------
     P05 · QUÉ NO ES INTELIGENCIA ARTIFICIAL
     --------------------------------------------------------- */
  var NOES = [
    { t: "magia", d: "Todo lo que hace se puede explicar con datos, matemáticas y cómputo." },
    { t: "conciencia", d: "No tiene intenciones, voluntad ni comprensión de sí misma." },
    { t: "inteligencia humana", d: "No razona ni entiende el mundo como una persona." },
    { t: "verdad absoluta", d: "Produce respuestas probables, no respuestas verificadas." },
    { t: "automatización simple", d: "La automatización sigue reglas fijas; la IA infiere a partir de datos." }
  ];

  window.PANTALLAS.push({
    id: "que-no-es",
    tema: "motor",
    modulo: "Fundamentos · 03",
    titulo: "¿Qué <span class=\"brillo\">no</span> es Inteligencia Artificial?",
    pregunta: "Despejar los malentendidos es tan importante como aprender la definición.",
    html: function () {
      return (
        '<div class="noes">' +
        NOES.map(function (n) {
          return (
            '<div class="noe" data-rev><span class="noe-eq">IA <b>≠</b> ' + n.t + "</span>" +
            "<p>" + n.d + "</p></div>"
          );
        }).join("") +
        "</div>" +
        '<div class="aviso aviso--alerta" data-rev><span class="marca">⚠️</span><p style="margin:0">' +
        "Un sistema de IA <b>puede producir resultados incorrectos y sonar convincente al hacerlo</b>. " +
        "Cuando inventa información que parece cierta, hablamos de <b>alucinación</b>: lo veremos con un ejemplo.</p></div>"
      );
    }
  });

  /* ---------------------------------------------------------
     P06 · ORÍGENES · LÍNEA DE TIEMPO
     --------------------------------------------------------- */
  window.PANTALLAS.push({
    id: "origenes",
    tema: "origenes",
    modulo: "Fundamentos · 04",
    titulo: "¿De dónde surge la Inteligencia Artificial?",
    pregunta: "No nació en 2022. Es el resultado de setenta años de investigación, con avances, frenos y reinicios.",
    html: function () {
      var h = window.FUENTES.hitos;
      var mitad = Math.ceil(h.length / 2);
      function fila(items, base) {
        return (
          '<div class="rail">' +
          '<div class="rail-linea"><i class="rail-pulso"></i></div>' +
          '<div class="rail-hitos">' +
          items.map(function (x, i) {
            return (
              '<div class="rail-hito' + (x.fuerte ? " rail-hito--fuerte" : "") +
              '" data-rev="' + (base + i * 85) + '">' +
              '<span class="punto"></span>' +
              '<span class="anio">' + x.anio + "</span>" +
              '<span class="txt">' + x.txt + "</span></div>"
            );
          }).join("") +
          "</div></div>"
        );
      }
      return (
        '<div class="tiempo-doble">' +
        fila(h.slice(0, mitad), 150) +
        fila(h.slice(mitad), 150 + mitad * 85) +
        "</div>"
      );
    },
    nota: 'Los hitos marcados en color son <strong>puntos de inflexión</strong>: cambian lo que la tecnología puede hacer, no solo su velocidad.'
  });

  /* ---------------------------------------------------------
     P07 · EVOLUCIÓN CONCEPTUAL
     --------------------------------------------------------- */
  var ESCALONES = [
    { t: "Programación tradicional", d: "Una persona escribe todas las reglas. El programa hace exactamente lo indicado.", e: "Si el valor es mayor a X, rechace." },
    { t: "Automatización", d: "Esas reglas se ejecutan solas, a gran escala y sin intervención.", e: "Radicar 5.000 facturas cada noche." },
    { t: "Machine Learning", d: "El sistema aprende las reglas a partir de ejemplos históricos.", e: "Aprender qué facturas se devolvieron." },
    { t: "Deep Learning", d: "Redes de muchas capas aprenden representaciones complejas: imagen, voz, texto.", e: "Detectar un hallazgo en una radiografía." },
    { t: "Transformers", d: "Una arquitectura que pesa el contexto completo de una secuencia.", e: "Entender una evolución clínica larga." },
    { t: "IA generativa", d: "Modelos que producen contenido nuevo a partir de una instrucción.", e: "Redactar un borrador de respuesta." },
    { t: "Agentes de IA", d: "Reciben un objetivo, planean, usan herramientas y ejecutan pasos con verificación.", e: "Revisar un lote de cuentas y priorizarlo." }
  ];

  window.PANTALLAS.push({
    id: "evolucion",
    tema: "motor",
    modulo: "Fundamentos · 05",
    titulo: "¿Cómo evolucionó hasta lo que usamos hoy?",
    pregunta: "Cada escalón no reemplaza al anterior: lo incorpora. Hoy conviven los siete en una misma institución.",
    html: function () {
      return (
        '<div class="escalera">' +
        ESCALONES.map(function (s, i) {
          return (
            '<div class="escalon" style="--n:' + i + '" data-rev="' + (140 + i * 150) + '">' +
            '<span class="escalon-num">' + (i + 1) + "</span>" +
            '<h3>' + s.t + "</h3>" +
            "<p>" + s.d + "</p>" +
            '<span class="escalon-ej">' + s.e + "</span>" +
            "</div>"
          );
        }).join("") +
        "</div>"
      );
    },
    nota: 'La diferencia clave: <strong>de ejecutar reglas escritas</strong> a <strong>inferir reglas desde los datos</strong> y, finalmente, a <strong>encadenar acciones hacia un objetivo</strong>.'
  });
})();

/* ===== assets/js/pantallas/03-motor.js ===== */
/* ============================================================
   MÓDULO 3 · CÓMO FUNCIONA
   Aprendizaje, redes neuronales, Transformers, IA generativa,
   agentes y usos actuales.
   ============================================================ */
(function () {
  "use strict";
  window.PANTALLAS = window.PANTALLAS || [];

  /* ---------------------------------------------------------
     P08 · ¿CÓMO APRENDE UNA IA?
     --------------------------------------------------------- */
  window.PANTALLAS.push({
    id: "como-aprende",
    tema: "motor",
    modulo: "Cómo funciona · 01",
    titulo: "¿Cómo aprende una Inteligencia Artificial?",
    pregunta: "Con ejemplos. Muchos. Y con una respuesta que nunca es un “sí” rotundo, sino una probabilidad.",
    html: function () {
      var ejemplos = ["🐕", "🐩", "🐕‍🦺", "🦮", "🐈", "🐇", "🐦", "🐈‍⬛", "🐕", "🐎", "🐕", "🐿️"];
      var etiquetas = [1, 1, 1, 1, 0, 0, 0, 0, 1, 0, 1, 0];
      var galeria = ejemplos.map(function (e, i) {
        return '<span class="muestra ' + (etiquetas[i] ? "muestra--si" : "muestra--no") +
          '" style="--md:' + (i * 90) + '">' + e + "</span>";
      }).join("");

      return `
      <div class="aprende">
        <div class="aprende-col">
          <h3 class="sub">1 · Entrenamiento</h3>
          <p class="txt">Se muestran miles de ejemplos <b>ya etiquetados</b>: esto es un perro, esto no lo es.</p>
          <div class="galeria">${galeria}</div>
          <div class="flujo flujo--mini">
            <div class="paso">Datos<small>ejemplos</small></div><div class="conector"><i class="pulso"></i></div>
            <div class="paso">Características<small>formas, texturas</small></div><div class="conector"><i class="pulso" style="--pd:300"></i></div>
            <div class="paso">Patrones<small>lo que se repite</small></div>
          </div>
        </div>

        <div class="aprende-col">
          <h3 class="sub">2 · Uso sobre un caso nuevo</h3>
          <div class="consulta">
            <span class="consulta-img">🐕</span>
            <p class="consulta-q">«¿Esto es un perro?»</p>
          </div>
          <div class="barras">
            <div class="barra barra--principal"><span>Perro</span>
              <span class="pista"><b class="relleno" data-pct="97"></b></span><span class="pct">97 %</span></div>
            <div class="barra"><span>Gato</span>
              <span class="pista"><b class="relleno" data-pct="2"></b></span><span class="pct">2 %</span></div>
            <div class="barra"><span>Otro</span>
              <span class="pista"><b class="relleno" data-pct="1"></b></span><span class="pct">1 %</span></div>
          </div>
          <div class="aviso aviso--clave">
            <span class="marca">📊</span>
            <p style="margin:0">La IA <b>no afirma</b>: estima. Muchos sistemas de IA trabajan con
            <b>modelos matemáticos y probabilísticos</b>, y por eso siempre existe un margen de error.</p>
          </div>
        </div>
      </div>`;
    },
    nota: 'Cambie “perro” por “hallazgo en una imagen” o “factura con riesgo de devolución” y tendrá el mismo mecanismo aplicado a salud.',
    init: function (raiz) {
      window.FX.activarBarras(raiz, 900);
    }
  });

  /* ---------------------------------------------------------
     P09 · REDES NEURONALES
     --------------------------------------------------------- */
  window.PANTALLAS.push({
    id: "redes-neuronales",
    tema: "motor",
    modulo: "Cómo funciona · 02",
    titulo: "¿Qué es una red neuronal artificial?",
    pregunta: "Una estructura matemática por capas donde cada conexión tiene un peso que se ajusta durante el entrenamiento.",
    html: function () {
      var capas = [4, 6, 6, 3];
      var W = 620, H = 260, mx = 70, my = 26;
      var paso = (W - mx * 2) / (capas.length - 1);
      var pos = [], svg = "", idx = 0;

      for (var c = 0; c < capas.length; c++) {
        var n = capas[c], col = [];
        for (var i = 0; i < n; i++) {
          col.push({ x: mx + paso * c, y: my + ((H - my * 2) * (n === 1 ? 0.5 : i / (n - 1))), id: idx++ });
        }
        pos.push(col);
      }
      /* conexiones */
      var d = 0;
      for (var c2 = 0; c2 < pos.length - 1; c2++) {
        for (var a = 0; a < pos[c2].length; a++) {
          for (var b = 0; b < pos[c2 + 1].length; b++) {
            svg += '<line x1="' + pos[c2][a].x + '" y1="' + pos[c2][a].y.toFixed(1) +
              '" x2="' + pos[c2 + 1][b].x + '" y2="' + pos[c2 + 1][b].y.toFixed(1) +
              '" stroke="var(--acento)" stroke-width="0.7" opacity="0.28" class="trazo-anim" style="--td:' +
              (200 + d * 9) + '"/>';
            d++;
          }
        }
      }
      /* nodos */
      for (var c3 = 0; c3 < pos.length; c3++) {
        for (var k = 0; k < pos[c3].length; k++) {
          var esBorde = c3 === 0 || c3 === pos.length - 1;
          svg += '<circle cx="' + pos[c3][k].x + '" cy="' + pos[c3][k].y.toFixed(1) + '" r="7" fill="' +
            (c3 === 0 ? "var(--acento)" : c3 === pos.length - 1 ? "var(--acento-3)" : "var(--acento-2)") +
            '" opacity="' + (esBorde ? 0.95 : 0.8) + '"><animate attributeName="opacity" values="' +
            (esBorde ? "0.95;0.6;0.95" : "0.8;0.35;0.8") + '" dur="' + (2.4 + k * 0.3).toFixed(1) +
            's" repeatCount="indefinite"/></circle>';
        }
      }
      /* rótulos */
      svg += '<text x="' + mx + '" y="' + (H - 2) + '" class="rn-rotulo" text-anchor="middle">Capa de entrada</text>';
      svg += '<text x="' + (mx + paso * 1.5) + '" y="' + (H - 2) + '" class="rn-rotulo" text-anchor="middle">Capas intermedias</text>';
      svg += '<text x="' + (W - mx) + '" y="' + (H - 2) + '" class="rn-rotulo" text-anchor="middle">Capa de salida</text>';

      return `
      <div class="redes">
        <div class="redes-graf">
          <svg class="svg-lienzo" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" aria-label="Diagrama de una red neuronal con capa de entrada, capas intermedias y capa de salida">${svg}</svg>
        </div>
        <div class="rejilla" data-col="3">
          <div class="tarjeta" data-rev><h3>Entrada</h3><p>Los datos del caso: valores de laboratorio, píxeles de una imagen, campos de una factura.</p></div>
          <div class="tarjeta" data-rev><h3>Capas intermedias</h3><p>Cada capa combina la anterior y detecta rasgos cada vez más abstractos. Los <b>pesos</b> se ajustan con los errores cometidos durante el entrenamiento.</p></div>
          <div class="tarjeta" data-rev><h3>Salida</h3><p>Un valor o una distribución de probabilidades sobre las categorías posibles.</p></div>
        </div>
        <div class="aviso aviso--alerta" data-rev><span class="marca">🧠</span><p style="margin:0">
          El nombre viene de una <b>analogía</b> con las neuronas biológicas. Una red neuronal artificial
          <b>no funciona como un cerebro humano</b>: es álgebra lineal y optimización, no biología.</p></div>
      </div>`;
    }
  });

  /* ---------------------------------------------------------
     P10 · TRANSFORMERS
     --------------------------------------------------------- */
  var FRASE = ["Paciente", "con", "dolor", "torácico", "y", "antecedente", "de", "hipertensión"];
  /* pares de atención: [origen, destino, peso] */
  var ATENCION = [[3, 2, 1], [5, 7, 1], [7, 2, 0.6], [2, 0, 0.5], [5, 0, 0.4]];

  window.PANTALLAS.push({
    id: "transformers",
    tema: "motor",
    modulo: "Cómo funciona · 03",
    titulo: "¿Qué es un <span class=\"brillo\">Transformer</span>?",
    pregunta: "La arquitectura que permitió a las máquinas tener en cuenta el contexto completo de una frase, no solo la palabra anterior.",
    html: function () {
      var toks = FRASE.map(function (t, i) {
        return '<span class="token" data-tok="' + i + '" style="--td:' + (i * 110) + '">' + t +
          '<i class="token-n">' + (i + 1) + "</i></span>";
      }).join("");
      return `
      <div class="transformer">
        <div class="tokens-marco">
          <svg class="atencion" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="tokens">${toks}</div>
        </div>

        <div class="rejilla" data-col="4">
          <div class="tarjeta" data-rev><h3>1 · Tokens</h3><p>El texto se corta en piezas mínimas. No siempre coinciden con palabras completas.</p></div>
          <div class="tarjeta" data-rev><h3>2 · Contexto</h3><p>Cada token se representa junto con su posición dentro de la secuencia.</p></div>
          <div class="tarjeta tarjeta--dest" data-rev><h3>3 · Atención</h3><p>El modelo calcula <b>cuánto debe mirar cada token a los demás</b>. «Torácico» pesa sobre «dolor»; «hipertensión» sobre «antecedente».</p></div>
          <div class="tarjeta" data-rev><h3>4 · Predicción</h3><p>Con ese contexto ponderado, estima el siguiente token más probable. Repitiendo el paso, construye la respuesta.</p></div>
        </div>

        <div class="aviso" data-rev><span class="marca">📄</span><p style="margin:0">
          <b>«Attention Is All You Need» (2017)</b> introdujo esta arquitectura. Es el hito que hizo
          posibles los grandes modelos de lenguaje que se usan hoy.</p></div>
      </div>`;
    },
    nota: 'Por eso un modelo puede relacionar un síntoma del primer renglón con un antecedente escrito diez líneas después.',
    init: function (raiz) {
      var marco = raiz.querySelector(".tokens-marco");
      var svg = raiz.querySelector(".atencion");
      var toks = raiz.querySelectorAll(".token");

      function dibujar() {
        if (!marco || !toks.length) return;
        var mb = marco.getBoundingClientRect();
        if (!mb.width) return;
        svg.setAttribute("viewBox", "0 0 " + mb.width + " " + mb.height);
        var d = "";
        ATENCION.forEach(function (par, k) {
          var a = toks[par[0]].getBoundingClientRect();
          var b = toks[par[1]].getBoundingClientRect();
          var x1 = a.left - mb.left + a.width / 2, y1 = a.top - mb.top;
          var x2 = b.left - mb.left + b.width / 2, y2 = b.top - mb.top;
          var alto = Math.min(mb.height * 0.85, 22 + Math.abs(x2 - x1) * 0.36);
          d += '<path d="M' + x1 + " " + y1 + " C" + x1 + " " + (y1 - alto) + " " + x2 + " " +
            (y2 - alto) + " " + x2 + " " + y2 + '" fill="none" stroke="var(--acento-2)" ' +
            'stroke-width="' + (1 + par[2] * 1.8).toFixed(1) + '" opacity="' + (0.25 + par[2] * 0.45).toFixed(2) +
            '" class="trazo-anim" style="--td:' + (900 + k * 260) + '"/>';
        });
        svg.innerHTML = d;
      }

      var t1 = setTimeout(dibujar, 220);
      var t2 = setTimeout(dibujar, 900);
      window.addEventListener("resize", dibujar);
      return function () {
        clearTimeout(t1); clearTimeout(t2);
        window.removeEventListener("resize", dibujar);
      };
    }
  });

  /* ---------------------------------------------------------
     P11 · IA GENERATIVA
     --------------------------------------------------------- */
  var GENERA = [
    { i: "📝", t: "Texto", d: "Resúmenes, borradores, respuestas" },
    { i: "🖼️", t: "Imágenes", d: "Ilustraciones y material visual" },
    { i: "🎧", t: "Audio", d: "Voz sintética y transcripción" },
    { i: "🎬", t: "Video", d: "Piezas cortas y animaciones" },
    { i: "💻", t: "Código", d: "Consultas, scripts, automatizaciones" },
    { i: "📊", t: "Análisis", d: "Interpretación de un conjunto de datos" },
    { i: "📄", t: "Documentos", d: "Actas, informes, comunicaciones" },
    { i: "🧾", t: "Datos estructurados", d: "Tablas y formatos normalizados" }
  ];

  window.PANTALLAS.push({
    id: "generativa",
    tema: "generativa",
    modulo: "Cómo funciona · 04",
    titulo: "¿Qué es la IA generativa?",
    pregunta: "Modelos que, a partir de una instrucción, producen contenido nuevo en distintos formatos.",
    html: function () {
      return `
      <div class="columna">
        <div class="rejilla" data-col="4">

/* ===== assets/js/motor.js ===== */
/* ============================================================
   MOTOR DE LA EXPERIENCIA
   - Presentación por pantallas completas (sin scroll, sin menús).
   - Único mecanismo de avance visible: los botones ATRÁS / SIGUIENTE.
   - Ajuste automático para que todo el contenido quede visible.
   ============================================================ */
(function () {
  "use strict";

  /* Espejo de teclado para proyección y accesibilidad (← → / espacio).
     No añade ningún elemento de navegación a la interfaz; si se desea la
     navegación estrictamente limitada a los dos botones, poner en false. */
  var TECLADO = true;

  var PANTALLAS = (window.PANTALLAS || []).slice();

  var escenario = document.getElementById("escenario");
  var btnAtras = document.getElementById("btn-atras");
  var btnSig = document.getElementById("btn-siguiente");
  var contador = document.getElementById("contador");
  var avance = document.getElementById("nav-avance");
  var capas = Array.prototype.slice.call(document.querySelectorAll("#fondo .capa"));

  var indice = 0;
  var animando = false;
  var limpiezaActual = null;
  var pantallaActual = null;
  var reducirMovimiento = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------------------------------------------------
     1. ESCALA TIPOGRÁFICA RESPONSIVA
     --------------------------------------------------------- */
  function calcularRaiz() {
    var w = window.innerWidth;
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    var base;
    if (w < 720) {
      // Teléfonos: manda el ancho; se mantiene la tipografía legible.
      base = Math.min(Math.max(w / 24, 14), 19);
    } else {
      base = Math.min(w / 46, h / 34);
      base = Math.min(Math.max(base, 14), 30);
    }
    document.documentElement.style.fontSize = base.toFixed(2) + "px";
  }

  /* ---------------------------------------------------------
     2. AJUSTE: nada se recorta, nada hace scroll
     --------------------------------------------------------- */
  function ajustar(seccion) {
    if (!seccion) return;
    var marco = seccion.querySelector(".marco");
    if (!marco) return;
    /* Se mide siempre sin escala aplicada; de lo contrario el propio ajuste
       se realimentaría y el contenido quedaría recortado. */
    marco.style.transform = "none";
    void marco.offsetHeight;

    var estilo = getComputedStyle(seccion);
    var padY = parseFloat(estilo.paddingTop) + parseFloat(estilo.paddingBottom);
    var padX = parseFloat(estilo.paddingLeft) + parseFloat(estilo.paddingRight);
    var dispAlto = escenario.clientHeight - padY;
    var dispAncho = escenario.clientWidth - padX;

    var caja = marco.getBoundingClientRect();
    var fy = caja.height > dispAlto ? dispAlto / caja.height : 1;
    var fx = caja.width > dispAncho ? dispAncho / caja.width : 1;
    var f = Math.min(fy, fx);

    if (f < 0.999) {
      marco.style.transform = "scale(" + Math.max(f, 0.55).toFixed(4) + ")";
    }
  }

  function ajustarActual() {
    ajustar(pantallaActual);
  }

  /* ---------------------------------------------------------
     3. CONSTRUCCIÓN DE UNA PANTALLA
     --------------------------------------------------------- */
  function construir(def, i) {
    var sec = document.createElement("section");
    sec.className = "pantalla";
    sec.setAttribute("data-tema", def.tema || "origenes");
    sec.setAttribute("data-id", def.id || "p" + i);
    sec.setAttribute("role", "group");
    sec.setAttribute("aria-label", "Pantalla " + (i + 1) + " de " + PANTALLAS.length + ": " + (def.titulo || ""));

    var marco = document.createElement("div");
    marco.className = "marco" + (def.marcoClase ? " " + def.marcoClase : "");

    var interior = "";
    if (!def.sinCabecera) {
      interior +=
        '<header class="cab" data-rev>' +
        (def.modulo ? '<span class="kicker">' + def.modulo + "</span>" : "") +
        (def.titulo ? '<h2 class="titulo">' + def.titulo + "</h2>" : "") +
        (def.pregunta ? '<p class="pregunta">' + def.pregunta + "</p>" : "") +
        "</header>";
    }
    interior += '<div class="cuerpo">' + (typeof def.html === "function" ? def.html() : def.html || "") + "</div>";
    if (def.nota) interior += '<p class="nota" data-rev>' + def.nota + "</p>";

    marco.innerHTML = interior;
    sec.appendChild(marco);
    return sec;
  }

  function escalonar(sec) {
    var elems = sec.querySelectorAll("[data-rev]");
    for (var i = 0; i < elems.length; i++) {
      var d = elems[i].getAttribute("data-rev");
      elems[i].style.setProperty("--rd", (d && d !== "" ? parseInt(d, 10) : 120 + i * 85));
    }
    sec.classList.add("rev-on");
  }

  /* ---------------------------------------------------------
     4. FONDO CROMÁTICO POR MÓDULO
     --------------------------------------------------------- */
  function pintarFondo(tema) {
    document.documentElement.setAttribute("data-tema", tema);
    for (var i = 0; i < capas.length; i++) {
      capas[i].classList.toggle("activa", capas[i].getAttribute("data-capa") === tema);
    }
    if (window.FX && window.FX.campo) window.FX.campo.actualizarPaleta();
  }

  /* ---------------------------------------------------------
     5. NAVEGACIÓN
     --------------------------------------------------------- */
  function actualizarNav() {
    var total = PANTALLAS.length;
    btnAtras.disabled = indice === 0;
    btnSig.disabled = indice === total - 1;
    btnSig.style.visibility = indice === total - 1 ? "hidden" : "visible";
    contador.textContent = "Pantalla " + (indice + 1) + " de " + total;
    avance.style.width = (total > 1 ? (indice / (total - 1)) * 100 : 100) + "%";
  }

  function mostrar(nuevo, direccion) {
    if (animando) return;
    if (nuevo < 0 || nuevo >= PANTALLAS.length) return;

    var def = PANTALLAS[nuevo];
    var anterior = pantallaActual;
    animando = true;

    if (typeof limpiezaActual === "function") {
      try { limpiezaActual(); } catch (e) { /* una animación no debe romper la navegación */ }
      limpiezaActual = null;
    }

    var sec = construir(def, nuevo);
    pintarFondo(def.tema || "origenes");

    if (anterior) {
      anterior.classList.remove("entra", "entra-r");
      anterior.classList.add(direccion < 0 ? "sale-r" : "sale");
      var viejo = anterior;
      setTimeout(function () { if (viejo.parentNode) viejo.parentNode.removeChild(viejo); },
        reducirMovimiento ? 10 : 400);
    }

    escenario.appendChild(sec);
    sec.classList.add(direccion < 0 ? "entra-r" : "entra");
    pantallaActual = sec;
    indice = nuevo;
    actualizarNav();

    if (typeof def.init === "function") {
      try { limpiezaActual = def.init(sec, { ajustar: ajustarActual, reducirMovimiento: reducirMovimiento }); }
      catch (e) { console.warn("Error inicializando la pantalla", def.id, e); }
    }

    requestAnimationFrame(function () {
      ajustar(sec);
      escalonar(sec);
      requestAnimationFrame(function () { ajustar(sec); });
    });
    setTimeout(function () { ajustar(sec); }, 420);
    setTimeout(function () { ajustar(sec); animando = false; }, reducirMovimiento ? 40 : 760);
  }

  function siguiente() { if (indice < PANTALLAS.length - 1) mostrar(indice + 1, 1); }
  function atras() { if (indice > 0) mostrar(indice - 1, -1); }

  btnSig.addEventListener("click", siguiente);
  btnAtras.addEventListener("click", atras);

  if (TECLADO) {
    window.addEventListener("keydown", function (ev) {
      if (ev.target && /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) return;
      if (ev.key === "ArrowRight" || ev.key === "PageDown" || ev.key === " ") { ev.preventDefault(); siguiente(); }
      else if (ev.key === "ArrowLeft" || ev.key === "PageUp") { ev.preventDefault(); atras(); }
    });
  }

  /* Evita cualquier desplazamiento accidental del documento */
  window.addEventListener("wheel", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  /* ---------------------------------------------------------
     6. ARRANQUE
     --------------------------------------------------------- */
  var reajuste;
  function alRedimensionar() {
    clearTimeout(reajuste);
    calcularRaiz();
    reajuste = setTimeout(function () { calcularRaiz(); ajustarActual(); }, 120);
    ajustarActual();
  }
  window.addEventListener("resize", alRedimensionar);
  window.addEventListener("orientationchange", function () { setTimeout(alRedimensionar, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener("resize", alRedimensionar);

  calcularRaiz();

  if (!PANTALLAS.length) {
    escenario.innerHTML =
      '<section class="pantalla"><div class="marco centro"><h2 class="titulo">No se cargaron las pantallas</h2>' +
      '<p class="pregunta">Verifique que los archivos de <code>assets/js/pantallas/</code> estén disponibles.</p></div></section>';
    return;
  }

  if (window.FX && window.FX.iniciarCampo) window.FX.iniciarCampo(document.getElementById("campo"));
  mostrar(0, 1);

  /* Reajusta cuando las fuentes terminan de cargar (evita saltos de layout) */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { calcularRaiz(); ajustarActual(); });
  }

  window.EXPERIENCIA = {
    ir: function (n) { mostrar(n, n > indice ? 1 : -1); },
    total: PANTALLAS.length,
    indice: function () { return indice; },
    ajustar: ajustarActual
  };
})();

</script>
