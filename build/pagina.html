<title>Inteligencia Artificial · Del concepto a su aplicación en el sector salud colombiano</title>
<style>
/* ===== assets/css/base.css ===== */
/* ============================================================
   BASE · tokens, temas cromáticos, tipografía, layout, navegación
   Experiencia: "Inteligencia Artificial: del concepto a su
   aplicación en el sector salud" — sin scroll, sin menús.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;               /* la experiencia nunca hace scroll vertical */
  overscroll-behavior: none;
}
@supports (height: 100dvh) {
  html, body { height: 100dvh; }
}

html {
  /* --raiz la calcula el motor en función del viewport (ver motor.js) */
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
               Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--tinta);
  background: #04060f;
  line-height: 1.35;
  letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ------------------------------------------------------------------
   PALETA BASE (se sobreescribe por tema en [data-tema])
   ------------------------------------------------------------------ */
:root {
  --nav-alto: 4.4rem;
  --marco-x: clamp(1.1rem, 4vw, 4.2rem);
  --marco-y: clamp(0.9rem, 2.6vh, 2.4rem);

  --tinta:        #eaf0ff;
  --tinta-suave:  #a8b6d8;
  --tinta-tenue:  #6f7e9f;

  --acento:       #6ea8ff;
  --acento-2:     #9ce8ff;
  --acento-3:     #ffd166;
  --alerta:       #ff8b6b;
  --ok:           #4fe0b0;

  --linea:        rgba(255,255,255,.14);
  --linea-fuerte: rgba(255,255,255,.3);
  --tarjeta:      rgba(255,255,255,.055);
  --tarjeta-alta: rgba(255,255,255,.1);
  --vidrio:       blur(14px) saturate(140%);
  --radio:        1rem;
  --radio-s:      .6rem;
  --sombra:       0 1.4rem 3.4rem rgba(0,0,0,.42);

  --p1: #6ea8ff;  /* colores de partículas del fondo */
  --p2: #9ce8ff;
}

/* --- Orígenes de la IA: negro, azul oscuro, blanco --- */
[data-tema="origenes"] {
  --acento:#8fb4ff; --acento-2:#dfe8ff; --acento-3:#ffd6a0;
  --p1:#8fb4ff; --p2:#ffffff;
}
/* --- Funcionamiento: azul eléctrico + violeta --- */
[data-tema="motor"] {
  --acento:#5b8cff; --acento-2:#b98cff; --acento-3:#63e6ff;
  --p1:#5b8cff; --p2:#b98cff;
}
/* --- IA generativa: violeta, turquesa, luminosidad --- */
[data-tema="generativa"] {
  --acento:#b06bff; --acento-2:#35e6d2; --acento-3:#ff9ae0;
  --p1:#b06bff; --p2:#35e6d2;
}
/* --- Salud: azules, verdes, blancos --- */
[data-tema="salud"] {
  --acento:#2ee6b0; --acento-2:#7fd6ff; --acento-3:#eaffff;
  --p1:#2ee6b0; --p2:#7fd6ff;
}
/* --- Administrativo: azul acero + ámbar de proceso --- */
[data-tema="admin"] {
  --acento:#64b5ff; --acento-2:#ffc46b; --acento-3:#8affd0;
  --p1:#64b5ff; --p2:#ffc46b;
}
/* --- Colombia: amarillo, azul y rojo, usados con sobriedad --- */
[data-tema="colombia"] {
  --acento:#ffcc29; --acento-2:#3d7bff; --acento-3:#ff5b5b;
  --p1:#ffcc29; --p2:#3d7bff;
}
/* --- Riesgos: ámbar y rojo de advertencia --- */
[data-tema="riesgo"] {
  --acento:#ffa63d; --acento-2:#ff6b5e; --acento-3:#ffe1a8;
  --p1:#ffa63d; --p2:#ff6b5e;
}
/* --- Futuro: oscuro con elementos luminosos --- */
[data-tema="futuro"] {
  --acento:#8fd8ff; --acento-2:#c9a5ff; --acento-3:#7cf5d0;
  --p1:#8fd8ff; --p2:#c9a5ff;
}

/* ------------------------------------------------------------------
   FONDO DINÁMICO (crossfade entre capas cromáticas)
   ------------------------------------------------------------------ */
#fondo { position: fixed; inset: 0; z-index: 0; overflow: hidden; }

#fondo .capa {
  position: absolute; inset: -10%;
  opacity: 0;
  transition: opacity 1100ms cubic-bezier(.4,0,.2,1);
  will-change: opacity;
}
#fondo .capa.activa { opacity: 1; }

[data-capa="origenes"] {
  background:
    radial-gradient(80% 60% at 20% 10%, #12224e 0%, transparent 60%),
    radial-gradient(70% 60% at 85% 90%, #0b1738 0%, transparent 62%),
    linear-gradient(160deg, #04060f 0%, #070d22 55%, #03050d 100%);
}
[data-capa="motor"] {
  background:
    radial-gradient(70% 55% at 15% 20%, #1b2ea8 0%, transparent 60%),
    radial-gradient(65% 60% at 88% 78%, #4a1f9c 0%, transparent 62%),
    linear-gradient(155deg, #050820 0%, #0a1040 55%, #05060f 100%);
}
[data-capa="generativa"] {
  background:
    radial-gradient(65% 55% at 78% 18%, #6a1fb0 0%, transparent 62%),
    radial-gradient(60% 55% at 12% 82%, #0d7d7a 0%, transparent 60%),
    linear-gradient(150deg, #120629 0%, #1d0b4a 55%, #06031a 100%);
}
[data-capa="salud"] {
  background:
    radial-gradient(70% 55% at 82% 15%, #0d6f7a 0%, transparent 62%),
    radial-gradient(65% 60% at 10% 85%, #0b5a45 0%, transparent 60%),
    linear-gradient(160deg, #03161c 0%, #05262f 55%, #02100f 100%);
}
[data-capa="admin"] {
  background:
    radial-gradient(70% 55% at 18% 12%, #123a6e 0%, transparent 62%),
    radial-gradient(60% 55% at 88% 84%, #5c3a10 0%, transparent 60%),
    linear-gradient(158deg, #051020 0%, #0a1e34 55%, #03080f 100%);
}
[data-capa="colombia"] {
  background:
    radial-gradient(58% 48% at 15% 12%, #5c4a08 0%, transparent 60%),
    radial-gradient(55% 50% at 86% 30%, #10306e 0%, transparent 60%),
    radial-gradient(50% 45% at 60% 92%, #56110f 0%, transparent 60%),
    linear-gradient(160deg, #050a18 0%, #081326 55%, #03060e 100%);
}
[data-capa="riesgo"] {
  background:
    radial-gradient(70% 55% at 80% 15%, #6e2a10 0%, transparent 62%),
    radial-gradient(60% 55% at 12% 85%, #5c1220 0%, transparent 60%),
    linear-gradient(158deg, #150607 0%, #240c0c 55%, #0b0304 100%);
}
[data-capa="futuro"] {
  background:
    radial-gradient(75% 60% at 50% 8%, #12305e 0%, transparent 62%),
    radial-gradient(55% 50% at 88% 88%, #3a1f6e 0%, transparent 60%),
    linear-gradient(165deg, #03030a 0%, #0a0a20 55%, #010104 100%);
}

#campo { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .7; }

.vineta {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(0,0,0,.55) 100%);
}

/* ------------------------------------------------------------------
   ESCENARIO Y PANTALLAS
   ------------------------------------------------------------------ */
#escenario {
  position: fixed;
  inset: 0 0 var(--nav-alto) 0;
  z-index: 1;
  overflow: hidden;
}

.pantalla {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--marco-y) var(--marco-x);
  will-change: transform, opacity, filter;
}

/* .marco es lo que el motor escala si el contenido excede la altura
   disponible: así nunca aparece scroll ni se recorta información. */
.marco {
  width: min(100%, 96rem);
  display: flex;
  flex-direction: column;
  gap: clamp(.5rem, 1.4vh, 1.2rem);
  transform-origin: center center;
}

/* --- Transiciones cinematográficas entre pantallas --- */
.pantalla.entra   { animation: entra 720ms cubic-bezier(.16,.84,.3,1) both; }
.pantalla.sale    { animation: sale 420ms cubic-bezier(.4,0,.9,.4) both; }
.pantalla.entra-r { animation: entraR 720ms cubic-bezier(.16,.84,.3,1) both; }
.pantalla.sale-r  { animation: saleR 420ms cubic-bezier(.4,0,.9,.4) both; }

@keyframes entra  { from { opacity:0; transform: translate3d(4.5%,0,0) scale(.965); filter: blur(9px); }
                    to   { opacity:1; transform: none; filter: none; } }
@keyframes sale   { from { opacity:1; transform: none; filter: none; }
                    to   { opacity:0; transform: translate3d(-3.5%,0,0) scale(.975); filter: blur(9px); } }
@keyframes entraR { from { opacity:0; transform: translate3d(-4.5%,0,0) scale(.965); filter: blur(9px); }
                    to   { opacity:1; transform: none; filter: none; } }
@keyframes saleR  { from { opacity:1; transform: none; filter: none; }
                    to   { opacity:0; transform: translate3d(3.5%,0,0) scale(.975); filter: blur(9px); } }

/* --- Aparición progresiva de elementos --- */
[data-rev] {
  opacity: 0;
  transform: translate3d(0, .9rem, 0);
}
.rev-on [data-rev] {
  animation: revelar 620ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--rd, 0) * 1ms);
}
@keyframes revelar { to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------------
   ENCABEZADO DE PANTALLA
   ------------------------------------------------------------------ */
.cab { display: flex; flex-direction: column; gap: .3rem; }

.kicker {
  display: inline-flex; align-items: center; gap: .55rem;
  font-size: .68rem; font-weight: 700; letter-spacing: .18em;
  text-transform: uppercase; color: var(--acento);
}
.kicker::before {
  content: ""; width: 1.6rem; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--acento), transparent);
}

h1.titulo {
  margin: 0;
  font-size: clamp(1.6rem, 4.4vw, 3.1rem);
  font-weight: 800; letter-spacing: -.03em; line-height: 1.02;
}
h2.titulo {
  margin: 0;
  font-size: clamp(1.25rem, 2.9vw, 2.05rem);
  font-weight: 800; letter-spacing: -.025em; line-height: 1.08;
}
.titulo .brillo {
  background: linear-gradient(100deg, var(--acento) 0%, var(--acento-2) 55%, var(--acento-3) 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
}
.pregunta {
  margin: 0;
  font-size: clamp(.86rem, 1.55vw, 1.06rem);
  color: var(--tinta-suave); font-weight: 500; max-width: 62ch;
}

.cuerpo { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(.5rem, 1.3vh, 1.1rem); }

.nota {
  font-size: .72rem; color: var(--tinta-tenue); margin: 0;
  line-height: 1.45; max-width: 110ch;
}
.nota strong { color: var(--tinta-suave); font-weight: 700; }

/* ------------------------------------------------------------------
   NAVEGACIÓN (único mecanismo de avance)
   ------------------------------------------------------------------ */
#navegacion {
  position: fixed; z-index: 5;
  left: 0; right: 0; bottom: 0;
  height: var(--nav-alto);
  padding: 0 clamp(.7rem, 3vw, 2.4rem) env(safe-area-inset-bottom);
  display: grid;
  grid-template-columns: 1fr minmax(6rem, 22rem) 1fr;
  align-items: center; gap: .8rem;
  background: linear-gradient(180deg, rgba(2,4,10,0) 0%, rgba(2,4,10,.72) 42%, rgba(2,4,10,.94) 100%);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgba(255,255,255,.07);
}

.nav-btn {
  justify-self: start;
  display: inline-flex; align-items: center; gap: .55rem;
  padding: .62rem 1.15rem;
  font: inherit; font-size: .85rem; font-weight: 700; letter-spacing: .01em;
  color: var(--tinta);
  background: var(--tarjeta);
  border: 1px solid var(--linea);
  border-radius: 999px;
  cursor: pointer;
  transition: transform .18s ease, background .22s ease, border-color .22s ease, opacity .22s ease;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn--primario {
  justify-self: end;
  color: #04060f;
  background: linear-gradient(100deg, var(--acento), var(--acento-2));
  border-color: transparent;
  box-shadow: 0 .5rem 1.6rem -.4rem var(--acento);
}
.nav-btn:hover:not(:disabled) { transform: translateY(-2px); background: var(--tarjeta-alta); }
.nav-btn--primario:hover:not(:disabled) { background: linear-gradient(100deg, var(--acento-2), var(--acento)); }
.nav-btn:active:not(:disabled) { transform: translateY(0) scale(.98); }
.nav-btn:disabled { opacity: .3; cursor: not-allowed; box-shadow: none; }
.nav-btn:focus-visible { outline: 2px solid var(--acento-2); outline-offset: 3px; }
.nav-flecha { font-size: 1.05em; line-height: 1; }

.nav-centro { display: flex; flex-direction: column; align-items: center; gap: .4rem; }
.nav-contador {
  margin: 0; font-size: .67rem; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--tinta-tenue);
  font-variant-numeric: tabular-nums;
}
.nav-barra {
  width: 100%; height: 3px; border-radius: 999px;
  background: rgba(255,255,255,.12); overflow: hidden;
  pointer-events: none;                 /* la barra no es interactiva */
}
.nav-barra i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--acento), var(--acento-2));
  border-radius: 999px;
  transition: width 620ms cubic-bezier(.16,.84,.3,1);
}

/* ------------------------------------------------------------------
   AVISOS Y ACCESIBILIDAD
   ------------------------------------------------------------------ */
#aviso-rotar {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center; text-align: center;
  padding: 2rem; background: rgba(3,5,12,.95);
  font-size: .95rem; color: var(--tinta-suave);
}
#aviso-rotar[hidden] { display: none; }

.solo-lectores {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  [data-rev] { opacity: 1; transform: none; }
  #campo { display: none; }
}

/* Pantallas muy bajas (proyección apaisada, celular horizontal) */
@media (max-height: 520px) {
  :root { --nav-alto: 3.5rem; --marco-y: .6rem; }
  .nav-btn { padding: .45rem .9rem; font-size: .78rem; }
}

/* ===== assets/css/componentes.css ===== */
/* ============================================================
   COMPONENTES reutilizables de la experiencia
   ============================================================ */

/* ---------- Rejillas ---------- */
.rejilla { display: grid; gap: clamp(.45rem, 1.1vw, .9rem); }
.rejilla[data-col="2"] { grid-template-columns: repeat(2, minmax(0,1fr)); }
.rejilla[data-col="3"] { grid-template-columns: repeat(3, minmax(0,1fr)); }
.rejilla[data-col="4"] { grid-template-columns: repeat(4, minmax(0,1fr)); }
.rejilla[data-col="5"] { grid-template-columns: repeat(5, minmax(0,1fr)); }
.rejilla[data-col="6"] { grid-template-columns: repeat(6, minmax(0,1fr)); }
.rejilla[data-col="auto"] { grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }

.fila { display: flex; gap: clamp(.4rem, 1vw, .85rem); align-items: stretch; flex-wrap: wrap; }
.fila--centro { justify-content: center; align-items: center; }
.columna { display: flex; flex-direction: column; gap: clamp(.4rem, 1vh, .8rem); }

/* ---------- Tarjetas ---------- */
.tarjeta {
  position: relative;
  padding: clamp(.6rem, 1.5vw, 1rem) clamp(.7rem, 1.6vw, 1.1rem);
  background: var(--tarjeta);
  border: 1px solid var(--linea);
  border-radius: var(--radio);
  backdrop-filter: var(--vidrio);
  display: flex; flex-direction: column; gap: .34rem;
  min-width: 0;
  transition: transform .3s ease, border-color .3s ease, background .3s ease;
}
.tarjeta:hover { transform: translateY(-3px); border-color: var(--linea-fuerte); background: var(--tarjeta-alta); }
.tarjeta h3 {
  margin: 0; font-size: clamp(.82rem, 1.35vw, .98rem); font-weight: 700;
  letter-spacing: -.01em; display: flex; align-items: center; gap: .45rem;
}
.tarjeta p { margin: 0; font-size: clamp(.7rem, 1.12vw, .84rem); color: var(--tinta-suave); }
.tarjeta .icono { font-size: 1.15em; line-height: 1; }

.tarjeta--acento { border-color: color-mix(in srgb, var(--acento) 45%, transparent); background: color-mix(in srgb, var(--acento) 9%, var(--tarjeta)); }
.tarjeta--alerta { border-color: color-mix(in srgb, var(--alerta) 50%, transparent); background: color-mix(in srgb, var(--alerta) 10%, var(--tarjeta)); }
.tarjeta--ok     { border-color: color-mix(in srgb, var(--ok) 45%, transparent);     background: color-mix(in srgb, var(--ok) 9%, var(--tarjeta)); }
.tarjeta--plana  { background: transparent; backdrop-filter: none; }

.tarjeta--dest {
  border-color: color-mix(in srgb, var(--acento) 55%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acento) 18%, transparent),
              0 1rem 2.4rem -1rem color-mix(in srgb, var(--acento) 60%, transparent);
}

/* ---------- Chips y etiquetas ---------- */
.chip {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .3rem .68rem; border-radius: 999px;
  font-size: clamp(.66rem, 1.05vw, .78rem); font-weight: 600;
  background: var(--tarjeta); border: 1px solid var(--linea);
  color: var(--tinta); white-space: nowrap;
}
.chip--acento { border-color: color-mix(in srgb, var(--acento) 55%, transparent); color: var(--acento); }
.chip--nube { animation: flotar 5s ease-in-out infinite; }
@keyframes flotar { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-.35rem); } }

.etiqueta {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .16rem .5rem; border-radius: .35rem;
  font-size: .6rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase;
}
.etiqueta::before { content: ""; width: .42rem; height: .42rem; border-radius: 999px; background: currentColor; }
.et-implementado  { color:#4fe0b0; background: rgba(79,224,176,.13); }
.et-piloto        { color:#7fd6ff; background: rgba(127,214,255,.13); }
.et-investigacion { color:#c9a5ff; background: rgba(201,165,255,.14); }
.et-propuesta     { color:#ffc46b; background: rgba(255,196,107,.13); }
.et-consolidado   { color:#4fe0b0; background: rgba(79,224,176,.13); }
.et-emergente     { color:#ffc46b; background: rgba(255,196,107,.13); }

/* ---------- Flujos / pipelines ---------- */
.flujo { display: flex; align-items: stretch; gap: 0; flex-wrap: nowrap; min-width: 0; }
.flujo--v { flex-direction: column; align-items: center; }

.paso {
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: .22rem;
  padding: clamp(.45rem, 1.1vw, .8rem) clamp(.3rem, .8vw, .6rem);
  background: var(--tarjeta); border: 1px solid var(--linea);
  border-radius: var(--radio-s);
  font-size: clamp(.62rem, 1.03vw, .78rem); font-weight: 700;
  letter-spacing: .01em;
}
.paso small { font-weight: 500; color: var(--tinta-tenue); font-size: .84em; letter-spacing: 0; }
.paso--ia { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 16%, var(--tarjeta)); color: var(--tinta); }
.paso--humano { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--tarjeta)); }

.conector {
  flex: 0 0 auto; align-self: center;
  width: clamp(.9rem, 2.2vw, 2rem); height: 2px;
  background: linear-gradient(90deg, var(--linea-fuerte), var(--acento));
  position: relative;
}
.conector::after {
  content: ""; position: absolute; right: -1px; top: 50%;
  transform: translateY(-50%);
  border-left: .38rem solid var(--acento);
  border-top: .27rem solid transparent; border-bottom: .27rem solid transparent;
}
.conector .pulso {
  position: absolute; top: 50%; left: 0; width: .42rem; height: .42rem;
  margin-top: -.21rem; border-radius: 999px; background: var(--acento-2);
  box-shadow: 0 0 .55rem var(--acento-2);
  animation: viaja 2.1s linear infinite; animation-delay: calc(var(--pd,0) * 1ms);
}
@keyframes viaja { 0% { left: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { left: 100%; opacity: 0; } }

.conector--v { width: 2px; height: clamp(.7rem, 1.8vh, 1.5rem); background: linear-gradient(180deg, var(--linea-fuerte), var(--acento)); }
.conector--v::after { right: 50%; top: auto; bottom: -1px; transform: translateX(50%);
  border-left: .27rem solid transparent; border-right: .27rem solid transparent;
  border-top: .38rem solid var(--acento); border-bottom: 0; }
.conector--v .pulso { left: 50%; top: 0; margin-left: -.21rem; margin-top: 0; animation-name: viajaV; }
@keyframes viajaV { 0% { top: 0; opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

/* ---------- Comparativas ---------- */
.comparativa { display: grid; gap: clamp(.5rem, 1.2vw, 1rem); }
.comparativa .col {
  padding: clamp(.6rem, 1.4vw, 1rem);
  border-radius: var(--radio); border: 1px solid var(--linea);
  background: var(--tarjeta); display: flex; flex-direction: column; gap: .4rem;
}
.comparativa .col h3 { margin: 0; font-size: clamp(.8rem, 1.3vw, .95rem); font-weight: 800; }
.comparativa .col ul { margin: 0; padding-left: 1rem; font-size: clamp(.68rem, 1.08vw, .8rem); color: var(--tinta-suave); }
.comparativa .col li { margin-bottom: .18rem; }

/* ---------- Listas ---------- */
.lista { list-style: none; margin: 0; padding: 0; display: grid; gap: .3rem; }
.lista li {
  display: flex; gap: .5rem; align-items: flex-start;
  font-size: clamp(.7rem, 1.1vw, .84rem); color: var(--tinta-suave);
}
.lista li::before { content: "▸"; color: var(--acento); font-size: .85em; line-height: 1.5; }
.lista--x li::before { content: "✕"; color: var(--alerta); }
.lista--ok li::before { content: "✓"; color: var(--ok); }

/* ---------- Métricas / KPI ---------- */
.kpi { display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
.kpi .valor {
  font-size: clamp(1.15rem, 2.5vw, 1.95rem); font-weight: 800; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums; line-height: 1;
  background: linear-gradient(100deg, var(--acento), var(--acento-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.kpi .rotulo { font-size: clamp(.64rem, 1.02vw, .76rem); font-weight: 600; color: var(--tinta); }
.kpi .meta { font-size: .6rem; color: var(--tinta-tenue); line-height: 1.25; }

/* ---------- Barras de probabilidad / distribución ---------- */
.barras { display: grid; gap: .38rem; }
.barra { display: grid; grid-template-columns: 5.2rem 1fr 3rem; align-items: center; gap: .5rem; font-size: clamp(.66rem, 1.05vw, .78rem); }
.barra .pista { height: .52rem; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
.barra .relleno {
  display: block; height: 100%; width: 0%; border-radius: 999px;
  background: linear-gradient(90deg, var(--acento), var(--acento-2));
  transition: width 1100ms cubic-bezier(.16,.84,.3,1);
}
.barra .pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--tinta-suave); }
.barra--principal .relleno { background: linear-gradient(90deg, var(--ok), var(--acento-2)); }
.barra--principal .pct { color: var(--ok); }

/* ---------- Avisos ---------- */
.aviso {
  display: flex; gap: .65rem; align-items: flex-start;
  padding: clamp(.5rem, 1.2vw, .85rem) clamp(.65rem, 1.4vw, 1rem);
  border-radius: var(--radio-s);
  border: 1px solid color-mix(in srgb, var(--acento) 45%, transparent);
  background: color-mix(in srgb, var(--acento) 10%, transparent);
  font-size: clamp(.7rem, 1.12vw, .84rem);
}
.aviso strong { color: var(--tinta); }
.aviso--alerta { border-color: color-mix(in srgb, var(--alerta) 55%, transparent); background: color-mix(in srgb, var(--alerta) 11%, transparent); }
.aviso--clave {
  border: 0; background: linear-gradient(100deg, color-mix(in srgb, var(--acento) 20%, transparent), color-mix(in srgb, var(--acento-2) 14%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acento) 35%, transparent);
}
.aviso .marca { font-size: 1.15em; line-height: 1.1; }

/* ---------- Cita de fuente ---------- */
.fuente {
  font-size: .58rem; color: var(--tinta-tenue); letter-spacing: .01em; line-height: 1.3;
}
.fuente b { color: var(--tinta-suave); font-weight: 600; }
.sin-dato { color: var(--acento-3); font-style: italic; }

/* ---------- Línea de tiempo ---------- */
.tiempo { position: relative; display: grid; gap: .35rem; }
.tiempo::before {
  content: ""; position: absolute; left: 0; right: 0; top: 1.15rem; height: 2px;
  background: linear-gradient(90deg, transparent, var(--linea-fuerte) 6%, var(--acento) 94%, transparent);
}
.tiempo .hitos { display: flex; gap: 0; }
.hito {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center;
  text-align: center; gap: .3rem; position: relative; padding-top: .55rem;
}
.hito .punto {
  width: .78rem; height: .78rem; border-radius: 999px;
  background: var(--acento); box-shadow: 0 0 0 .28rem color-mix(in srgb, var(--acento) 22%, transparent);
  position: relative; z-index: 1;
}
.hito .anio { font-size: clamp(.66rem, 1.1vw, .82rem); font-weight: 800; letter-spacing: -.01em; }
.hito .txt { font-size: clamp(.56rem, .92vw, .68rem); color: var(--tinta-suave); line-height: 1.22; }
.hito--fuerte .punto { background: var(--acento-2); box-shadow: 0 0 0 .3rem color-mix(in srgb, var(--acento-2) 26%, transparent), 0 0 1rem var(--acento-2); }
.hito--fuerte .anio { color: var(--acento-2); }

/* ---------- Tablero (gerencia) ---------- */
.tablero {
  display: grid; gap: .45rem;
  padding: clamp(.55rem, 1.3vw, .95rem);
  border-radius: var(--radio); border: 1px solid var(--linea);
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
}
.mini-graf { display: flex; align-items: flex-end; gap: .18rem; height: 2.6rem; }
.mini-graf i {
  flex: 1; border-radius: .16rem .16rem 0 0;
  background: linear-gradient(180deg, var(--acento-2), var(--acento));
  height: 12%; transform-origin: bottom;
  animation: crecer 900ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--bd,0) * 1ms);
}
@keyframes crecer { from { height: 4%; opacity: .2; } to { height: var(--h, 50%); opacity: 1; } }

/* ---------- Nodos y red ---------- */
.svg-lienzo { width: 100%; height: 100%; display: block; overflow: visible; }
.trazo-anim { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: trazar 1600ms ease forwards; animation-delay: calc(var(--td,0) * 1ms); }
@keyframes trazar { to { stroke-dashoffset: 0; } }
.pulsa { animation: pulsar 2.6s ease-in-out infinite; animation-delay: calc(var(--pd,0) * 1ms); }
@keyframes pulsar { 0%,100% { opacity: .45; r: var(--r0); } 50% { opacity: 1; } }

/* ---------- Utilidades ---------- */
.centro { text-align: center; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
.grande { font-size: clamp(1.05rem, 2.3vw, 1.7rem); font-weight: 800; letter-spacing: -.025em; }
.enfasis { color: var(--acento-2); font-weight: 700; }
.tenue { color: var(--tinta-tenue); }
.pleno { flex: 1 1 auto; min-height: 0; }

/* ===== assets/css/pantallas.css ===== */
/* ============================================================
   ESTILOS ESPECÍFICOS DE CADA PANTALLA
   ============================================================ */

/* ============================================================
   PERSONAJES
   ============================================================ */
.personaje { margin: 0; display: flex; flex-direction: column; align-items: center; gap: .25rem; }
.personaje-lienzo { width: clamp(2.6rem, 6vw, 4.2rem); aspect-ratio: 1; }
.personaje figcaption { font-size: .58rem; color: var(--tinta-tenue); text-align: center; letter-spacing: .04em; }
.svg-persona, .svg-nova { width: 100%; height: 100%; display: block; }
.nova-orbita { transform-origin: 50% 50%; animation: girar 22s linear infinite; }
.nova-orbita--inv { animation-duration: 14s; animation-direction: reverse; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ============================================================
   AVISO PREVIO (primera pantalla)
   ============================================================ */
.aviso-punto {
  padding: clamp(.65rem, 1.5vw, 1.1rem);
  border-radius: var(--radio);
  border: 1px solid var(--linea);
  background: var(--tarjeta);
  backdrop-filter: var(--vidrio);
  display: flex; flex-direction: column; gap: .35rem;
  border-top: 2px solid color-mix(in srgb, var(--acento) 60%, transparent);
}
.aviso-punto-i { font-size: clamp(1.1rem, 2.4vw, 1.7rem); line-height: 1; }
.aviso-punto h3 {
  margin: 0; font-size: clamp(.78rem, 1.28vw, .95rem); font-weight: 800;
  letter-spacing: -.015em; text-wrap: balance;
}
.aviso-punto p { margin: 0; font-size: clamp(.66rem, 1.06vw, .8rem); color: var(--tinta-suave); }

.aviso-banda {
  display: flex; flex-direction: column; align-items: center; gap: .25rem; text-align: center;
  padding: clamp(.7rem, 1.8vw, 1.25rem) clamp(.8rem, 2vw, 1.6rem);
  border-radius: var(--radio);
  background: linear-gradient(100deg,
    color-mix(in srgb, var(--acento) 22%, transparent),
    color-mix(in srgb, var(--acento-2) 14%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acento) 45%, transparent);
}
.aviso-banda-eti {
  font-size: .6rem; letter-spacing: .24em; text-transform: uppercase;
  font-weight: 800; color: var(--acento-2);
}
.aviso-banda-txt {
  margin: 0; font-size: clamp(1rem, 2.5vw, 1.75rem); font-weight: 800;
  letter-spacing: -.025em; text-wrap: balance; max-width: 40ch;
}

/* ============================================================
   P01 · PORTADA
   ============================================================ */
.marco--pleno { height: 100%; }
.portada { position: relative; display: grid; place-items: center; width: 100%; min-height: clamp(16rem, 62vh, 40rem); }
.portada-red { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .82; }
.portada-txt { position: relative; z-index: 1; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .55rem; }
.portada-titulo { font-size: clamp(2.1rem, 8.2vw, 5.6rem); letter-spacing: -.045em; line-height: .95; }
.portada-sub { margin: 0; font-size: clamp(.86rem, 2.1vw, 1.35rem); font-weight: 600; color: var(--tinta-suave); max-width: 30ch; }
.portada-cita {
  margin: .3rem 0 0; max-width: 46ch; font-size: clamp(.72rem, 1.35vw, .92rem);
  color: var(--tinta-tenue); font-style: italic; line-height: 1.5;
  padding-top: .55rem; border-top: 1px solid var(--linea);
}
.portada-pie { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center; margin-top: .35rem; }

/* ============================================================
   P02 · PREGUNTA DE APERTURA
   ============================================================ */
.apertura { display: flex; flex-direction: column; gap: clamp(.6rem, 2vh, 1.4rem); align-items: center; }
.nube-ideas {
  display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center;
  max-width: 62rem;
}
.idea {
  padding: .38rem .85rem; border-radius: 999px;
  background: var(--tarjeta); border: 1px solid var(--linea);
  font-size: clamp(.7rem, 1.5vw, .95rem); font-weight: 600; color: var(--tinta-suave);
  opacity: 0; transform: scale(.85) translateY(.5rem);
  animation: ideaEntra 700ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--id) * 1ms);
}
@keyframes ideaEntra { to { opacity: 1; transform: none; } }

.revelacion {
  text-align: center; max-width: 56rem;
  opacity: 0; transform: translateY(1rem) scale(.97);
  transition: opacity 900ms ease, transform 900ms cubic-bezier(.16,.84,.3,1);
}
.revelacion.on { opacity: 1; transform: none; }
.revelacion-txt { margin: 0; font-size: clamp(1.1rem, 3.1vw, 2.1rem); font-weight: 800; letter-spacing: -.03em; }
.revelacion-sub { margin: .4rem auto 0; max-width: 60ch; font-size: clamp(.74rem, 1.25vw, .92rem); color: var(--tinta-suave); }

/* ============================================================
   COMUNES DE CONTENIDO
   ============================================================ */
.sub { margin: 0; font-size: clamp(.76rem, 1.25vw, .92rem); font-weight: 700; letter-spacing: .01em; color: var(--acento); }
.txt { margin: 0; font-size: clamp(.72rem, 1.15vw, .86rem); color: var(--tinta-suave); }
.flujo-marco {
  padding: clamp(.5rem, 1.3vw, .9rem);
  border-radius: var(--radio); border: 1px solid var(--linea);
  background: rgba(255,255,255,.035); display: flex; flex-direction: column; gap: .45rem;
}
.flujo-rotulo { font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; color: var(--tinta-tenue); font-weight: 700; }
.tarjeta--compacta { gap: .2rem; padding: clamp(.5rem, 1.2vw, .8rem) clamp(.55rem, 1.3vw, .9rem); }
.tarjeta--compacta h3 { font-size: clamp(.74rem, 1.2vw, .88rem); }
.tarjeta--compacta p { font-size: clamp(.65rem, 1.02vw, .77rem); }

.mensaje-clave {
  display: flex; align-items: center; gap: .9rem; justify-content: center;
  padding: clamp(.6rem, 1.6vw, 1.05rem) clamp(.8rem, 2vw, 1.5rem);
  border-radius: var(--radio);
  background: linear-gradient(100deg, color-mix(in srgb, var(--acento) 20%, transparent), color-mix(in srgb, var(--acento-2) 12%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acento) 40%, transparent);
}
.mensaje-clave p { margin: 0; font-size: clamp(.84rem, 1.75vw, 1.15rem); font-weight: 700; letter-spacing: -.015em; }
.mensaje-clave .marca { font-size: 1.4em; }
.mensaje-clave--ok { background: linear-gradient(100deg, color-mix(in srgb, var(--ok) 20%, transparent), transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 40%, transparent); }

/* ============================================================
   P05 · QUÉ NO ES
   ============================================================ */
.noes { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: clamp(.45rem, 1.1vw, .85rem); }
.noe {
  padding: clamp(.6rem, 1.4vw, 1rem); border-radius: var(--radio);
  border: 1px solid var(--linea); background: var(--tarjeta);
  display: flex; flex-direction: column; gap: .4rem; text-align: center;
  position: relative; overflow: hidden;
}
.noe::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--alerta), transparent); opacity: .7;
}
.noe-eq { font-size: clamp(.78rem, 1.45vw, 1.02rem); font-weight: 800; letter-spacing: -.02em; }
.noe-eq b { color: var(--alerta); font-size: 1.15em; margin: 0 .1em; }
.noe p { margin: 0; font-size: clamp(.64rem, 1.02vw, .76rem); color: var(--tinta-suave); }

/* ============================================================
   P06 · LÍNEA DE TIEMPO
   ============================================================ */
.tiempo-doble { display: flex; flex-direction: column; gap: clamp(.7rem, 2.2vh, 1.6rem); }
.rail { position: relative; padding-top: .3rem; }
.rail-linea {
  position: absolute; left: 2%; right: 2%; top: .72rem; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--linea-fuerte) 8%, var(--acento) 92%, transparent);
  overflow: hidden;
}
.rail-pulso {
  position: absolute; top: -2px; left: 0; width: 3.5rem; height: 6px; border-radius: 999px;
  background: linear-gradient(90deg, transparent, var(--acento-2), transparent);
  filter: blur(2px); animation: railViaja 4.5s linear infinite;
}
@keyframes railViaja { 0% { left: -10%; } 100% { left: 105%; } }
.rail-hitos { display: flex; gap: .2rem; }
.rail-hito { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: .25rem; }
.rail-hito .punto {
  width: .72rem; height: .72rem; border-radius: 999px; background: var(--acento);
  box-shadow: 0 0 0 .26rem color-mix(in srgb, var(--acento) 20%, transparent);
}
.rail-hito--fuerte .punto {
  background: var(--acento-2);
  box-shadow: 0 0 0 .3rem color-mix(in srgb, var(--acento-2) 26%, transparent), 0 0 .9rem var(--acento-2);
}
.rail-hito .anio { font-size: clamp(.66rem, 1.1vw, .84rem); font-weight: 800; letter-spacing: -.01em; }
.rail-hito--fuerte .anio { color: var(--acento-2); }
.rail-hito .txt { font-size: clamp(.53rem, .88vw, .67rem); color: var(--tinta-suave); line-height: 1.25; }

/* ============================================================
   P07 · ESCALERA DE EVOLUCIÓN
   ============================================================ */
.escalera { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: .4rem; align-items: end; }
.escalon {
  padding: clamp(.5rem, 1.2vw, .85rem); border-radius: var(--radio-s);
  border: 1px solid var(--linea); background: var(--tarjeta);
  display: flex; flex-direction: column; gap: .26rem; position: relative;
  transform: translateY(calc((6 - var(--n)) * .55rem));
  border-bottom: 2px solid color-mix(in srgb, var(--acento) calc(var(--n) * 14%), transparent);
}
.escalon-num {
  position: absolute; top: -.55rem; left: .6rem;
  width: 1.2rem; height: 1.2rem; border-radius: 999px;
  display: grid; place-items: center; font-size: .6rem; font-weight: 800;
  background: var(--acento); color: #05070f;
}
.escalon h3 { margin: .25rem 0 0; font-size: clamp(.68rem, 1.08vw, .82rem); font-weight: 800; letter-spacing: -.015em; }
.escalon p { margin: 0; font-size: clamp(.58rem, .95vw, .7rem); color: var(--tinta-suave); }
.escalon-ej { font-size: .58rem; color: var(--acento-2); font-style: italic; margin-top: auto; padding-top: .3rem; border-top: 1px dashed var(--linea); }

/* ============================================================
   P08 · CÓMO APRENDE
   ============================================================ */
.aprende { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(.6rem, 1.6vw, 1.3rem); }
.aprende-col { display: flex; flex-direction: column; gap: .5rem; }
.galeria { display: grid; grid-template-columns: repeat(6, 1fr); gap: .3rem; }
.muestra {
  aspect-ratio: 1; display: grid; place-items: center; border-radius: .5rem;
  font-size: clamp(1rem, 2.4vw, 1.7rem); border: 1px solid var(--linea);
  background: rgba(255,255,255,.05);
  opacity: 0; transform: scale(.7);
  animation: muestraEntra 520ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--md) * 1ms + 200ms);
}
@keyframes muestraEntra { to { opacity: 1; transform: none; } }
.muestra--si { border-color: color-mix(in srgb, var(--ok) 60%, transparent); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.muestra--no { border-color: rgba(255,255,255,.14); }
.flujo--mini .paso { font-size: clamp(.58rem, .95vw, .7rem); padding: .38rem .3rem; }

.consulta {
  display: flex; align-items: center; gap: .8rem;
  padding: clamp(.5rem, 1.3vw, .9rem); border-radius: var(--radio);
  border: 1px dashed var(--linea-fuerte); background: rgba(255,255,255,.04);
}
.consulta-img { font-size: clamp(1.6rem, 4vw, 2.6rem); }
.consulta-q { margin: 0; font-size: clamp(.85rem, 1.8vw, 1.15rem); font-weight: 700; }

/* ============================================================
   P09 · REDES NEURONALES
   ============================================================ */
.redes { display: flex; flex-direction: column; gap: clamp(.5rem, 1.4vh, 1rem); }
.redes-graf { height: clamp(7rem, 26vh, 15rem); }
.rn-rotulo { font-size: 9px; fill: var(--tinta-tenue); font-family: inherit; letter-spacing: .06em; text-transform: uppercase; }

/* ============================================================
   P10 · TRANSFORMERS
   ============================================================ */
.transformer { display: flex; flex-direction: column; gap: clamp(.5rem, 1.4vh, 1rem); }
.tokens-marco { position: relative; padding-top: clamp(2.2rem, 8vh, 4.2rem); }
.atencion { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tokens { display: flex; flex-wrap: wrap; gap: .35rem; justify-content: center; position: relative; }
.token {
  position: relative; padding: .4rem .7rem .55rem; border-radius: .5rem;
  background: color-mix(in srgb, var(--acento) 14%, var(--tarjeta));
  border: 1px solid color-mix(in srgb, var(--acento) 40%, transparent);
  font-size: clamp(.7rem, 1.35vw, .92rem); font-weight: 600;
  opacity: 0; transform: translateY(.6rem);
  animation: tokEntra 480ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--td) * 1ms + 200ms);
}
@keyframes tokEntra { to { opacity: 1; transform: none; } }
.token-n {
  position: absolute; bottom: .1rem; left: 50%; transform: translateX(-50%);
  font-size: .48rem; color: var(--tinta-tenue); font-style: normal;
}

/* ============================================================
   P11 · IA GENERATIVA
   ============================================================ */
.tarjeta--gen { align-items: flex-start; }
.consola {
  border-radius: var(--radio); border: 1px solid var(--linea);
  background: rgba(6,4,18,.55); overflow: hidden;
}
.consola-cab {
  display: flex; align-items: center; gap: .35rem;
  padding: .35rem .7rem; background: rgba(255,255,255,.06); border-bottom: 1px solid var(--linea);
}
.punto-rojo, .punto-amb, .punto-verd { width: .5rem; height: .5rem; border-radius: 999px; }
.punto-rojo { background: #ff6b5e; } .punto-amb { background: #ffc46b; } .punto-verd { background: #4fe0b0; }
.consola-tit { margin-left: .5rem; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-tenue); }
.consola-in { margin: 0; padding: .55rem .8rem .2rem; font-size: clamp(.68rem, 1.1vw, .82rem); color: var(--tinta-suave); }
.consola-out {
  margin: 0; padding: .3rem .8rem .7rem; white-space: pre-wrap;
  font-size: clamp(.68rem, 1.1vw, .82rem); color: var(--acento-2); min-height: 3.6em;
}
.consola-out::after { content: "▌"; animation: cursor 1s steps(2) infinite; color: var(--acento-2); }
@keyframes cursor { 50% { opacity: 0; } }

/* ============================================================
   P12 · AUTOMATIZACIÓN / IA / AGENTE
   ============================================================ */
.col--dest { border-color: color-mix(in srgb, var(--acento) 55%, transparent); background: color-mix(in srgb, var(--acento) 10%, var(--tarjeta)); }
.comparativa .ej {
  margin-top: auto; padding-top: .35rem; border-top: 1px dashed var(--linea);
  font-size: .62rem; color: var(--acento-2); font-style: italic;
}

/* ============================================================
   P13 · ECOSISTEMA / ÓRBITA
   ============================================================ */
.ecosistema { display: grid; place-items: center; width: 100%; }
.orbita {
  position: relative;
  width: min(100%, 46rem);
  height: clamp(11rem, 48vh, 26rem);
  margin: 0 auto;
}
.orbita-anillo {
  position: absolute; left: 9%; right: 9%; top: 10%; bottom: 10%;
  border: 1px dashed color-mix(in srgb, var(--acento) 30%, transparent);
  border-radius: 50%;
  animation: girar 40s linear infinite;
}
.orbita-centro {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: clamp(3.4rem, 9vw, 6rem); display: grid; place-items: center; text-align: center;
}
.orbita-centro .svg-nova { width: 100%; }
.orbita-nom { position: absolute; bottom: -1.1rem; font-size: .62rem; letter-spacing: .2em; color: var(--acento-2); font-weight: 700; white-space: nowrap; }
.orbe {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: .05rem;
  opacity: 0; animation: orbeEntra 620ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--od) * 1ms + 200ms);
  width: 6.4rem; text-align: center;
}
@keyframes orbeEntra { from { opacity: 0; } to { opacity: 1; } }
.orbe-i { font-size: clamp(.95rem, 2vw, 1.4rem); line-height: 1.1; }
.orbe-t { font-size: clamp(.54rem, .92vw, .68rem); color: var(--tinta-suave); font-weight: 600; line-height: 1.15; }

/* ============================================================
   P14 · DOS MUNDOS
   ============================================================ */
.dos-mundos { display: grid; grid-template-columns: 1fr .62fr 1fr; gap: clamp(.5rem, 1.4vw, 1.1rem); align-items: stretch; }
.mundo {
  padding: clamp(.6rem, 1.5vw, 1.05rem); border-radius: var(--radio);
  border: 1px solid var(--linea); background: var(--tarjeta);
  display: flex; flex-direction: column; gap: .45rem;
}
.mundo--asistencial { border-color: color-mix(in srgb, var(--acento) 45%, transparent); background: color-mix(in srgb, var(--acento) 9%, var(--tarjeta)); }
.mundo--administrativo { border-color: color-mix(in srgb, var(--acento-2) 45%, transparent); background: color-mix(in srgb, var(--acento-2) 9%, var(--tarjeta)); }
.mundo-eti { font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--tinta-tenue); font-weight: 700; }
.mundo h3 { margin: 0; font-size: clamp(1rem, 2.2vw, 1.5rem); font-weight: 800; letter-spacing: -.025em; }
.mundo p { margin: 0; font-size: clamp(.68rem, 1.1vw, .82rem); color: var(--tinta-suave); }
.mundo-personas { display: flex; gap: .8rem; justify-content: center; padding: .3rem 0; }
.mundo-centro { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; text-align: center; }
.mundo-nova { width: clamp(4rem, 12vw, 7.5rem); aspect-ratio: 1; }
.mundo-nova-nom { font-size: .68rem; letter-spacing: .22em; font-weight: 800; color: var(--acento-2); }
.mundo-nova-txt { margin: .3rem 0 0; font-size: clamp(.62rem, 1vw, .74rem); color: var(--tinta-tenue); max-width: 20ch; }

/* ============================================================
   P15 · APLICACIONES ASISTENCIALES
   ============================================================ */
.apl { display: flex; flex-direction: column; gap: .28rem; }
.apl-item { display: flex; align-items: center; justify-content: space-between; gap: .4rem; }
.apl-item b { font-size: clamp(.63rem, 1vw, .76rem); font-weight: 600; color: var(--tinta-suave); }

/* ============================================================
   P16 · CADENA CLÍNICA
   ============================================================ */
.cadena { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .3rem; }
.eslabon {
  display: flex; flex-direction: column; align-items: center; gap: .18rem; text-align: center;
  padding: .45rem .6rem; border-radius: var(--radio-s);
  border: 1px solid var(--linea); background: var(--tarjeta);
  min-width: 5.2rem;
  opacity: .28; transform: translateY(.3rem);
  transition: opacity .5s ease, transform .5s ease, border-color .5s ease, box-shadow .5s ease;
}
.eslabon.on { opacity: 1; transform: none; }
.eslabon-i { font-size: clamp(.95rem, 2vw, 1.35rem); }
.eslabon-t { font-size: clamp(.56rem, .95vw, .7rem); font-weight: 700; }
.eslabon--ia.on { border-color: var(--acento); box-shadow: 0 0 1.2rem -.4rem var(--acento); background: color-mix(in srgb, var(--acento) 14%, var(--tarjeta)); }
.eslabon--humano.on { border-color: var(--acento-2); background: color-mix(in srgb, var(--acento-2) 12%, var(--tarjeta)); }
.eslabon--decision.on { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 16%, var(--tarjeta)); box-shadow: 0 0 1.4rem -.4rem var(--ok); }
.eslabon-flecha { color: var(--tinta-tenue); font-size: .8rem; }

/* ============================================================
   P17 · ALAS ADMINISTRATIVAS
   ============================================================ */
.ala {
  padding: clamp(.55rem, 1.3vw, .95rem); border-radius: var(--radio);
  border: 1px solid var(--linea); background: var(--tarjeta);
  display: flex; flex-direction: column; gap: .4rem;
}
.ala h3 { margin: 0; font-size: clamp(.76rem, 1.25vw, .92rem); font-weight: 800; display: flex; align-items: center; gap: .4rem; }
.ala-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .22rem; }
.ala-lista li {
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  font-size: clamp(.62rem, 1vw, .75rem); color: var(--tinta-suave);
  padding-bottom: .18rem; border-bottom: 1px solid rgba(255,255,255,.05);
}
.pot { display: inline-flex; gap: .12rem; flex: 0 0 auto; }
.pt { width: .3rem; height: .3rem; border-radius: 999px; background: rgba(255,255,255,.18); }
.pt--on { background: var(--acento-2); box-shadow: 0 0 .35rem var(--acento-2); }
.leyenda { display: flex; flex-wrap: wrap; align-items: center; gap: .7rem; font-size: .62rem; color: var(--tinta-tenue); }
.leyenda-t { font-weight: 700; color: var(--tinta-suave); }
.leyenda-i { display: inline-flex; align-items: center; gap: .18rem; }
.leyenda-i .pt { margin-right: .04rem; }
.leyenda-n { font-style: italic; }

/* ============================================================
   P18 · CICLO DE FACTURACIÓN
   ============================================================ */
.flujo--9 .paso { position: relative; }
.marca-ia {
  position: absolute; top: -.42rem; right: -.3rem;
  background: var(--acento); color: #05070f;
  font-size: .5rem; font-weight: 800; letter-spacing: .06em;
  padding: .08rem .3rem; border-radius: .25rem;
}

/* ============================================================
   P19-P20 · CAJAS NORMATIVAS
   ============================================================ */
.norma-caja {
  padding: clamp(.6rem, 1.4vw, 1rem); border-radius: var(--radio);
  border: 1px solid var(--linea); background: rgba(255,255,255,.045);
  display: flex; flex-direction: column; gap: .3rem;
}
.norma-caja--dest { border-color: color-mix(in srgb, var(--acento) 50%, transparent); background: color-mix(in srgb, var(--acento) 8%, rgba(255,255,255,.04)); }
.norma-eti { font-size: .56rem; letter-spacing: .18em; text-transform: uppercase; font-weight: 800; color: var(--acento); }
.norma-caja h3 { margin: 0; font-size: clamp(.8rem, 1.35vw, 1rem); font-weight: 800; }
.norma-caja p { margin: 0; font-size: clamp(.66rem, 1.06vw, .8rem); color: var(--tinta-suave); }

.glosa-panel { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(.6rem, 1.6vw, 1.2rem); align-items: start; }
.glosa-dims { display: flex; flex-direction: column; gap: .5rem; }
.dims { display: flex; flex-wrap: wrap; gap: .35rem; }
.dim {
  padding: .34rem .7rem; border-radius: .45rem;
  background: color-mix(in srgb, var(--acento-2) 12%, var(--tarjeta));
  border: 1px solid color-mix(in srgb, var(--acento-2) 35%, transparent);
  font-size: clamp(.64rem, 1.05vw, .8rem); font-weight: 600;
  opacity: 0; animation: dimEntra 520ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--dd) * 1ms + 300ms);
}
@keyframes dimEntra { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
.glosa-flujo .flujo--v { width: 100%; }
.glosa-flujo .paso { width: 100%; }

/* ============================================================
   P21 · CARTERA
   ============================================================ */
.cartera { display: grid; grid-template-columns: repeat(6, 1fr); gap: clamp(.3rem, 1vw, .8rem); align-items: end; height: clamp(7rem, 24vh, 13rem); }
.edad { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .25rem; height: 100%; }
.edad-barra { width: 100%; flex: 1 1 auto; display: flex; align-items: flex-end; }
.edad-barra i {
  display: block; width: 100%; border-radius: .4rem .4rem 0 0; height: 0;
  background: linear-gradient(180deg, var(--acento-2), var(--acento));
  animation: edadCrece 1s cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--ed) * 1ms + 300ms);
}
@keyframes edadCrece { to { height: calc(var(--h) * 2.6); } }
.edad--medio .edad-barra i { background: linear-gradient(180deg, #ffc46b, #e08a2e); }
.edad--alto .edad-barra i { background: linear-gradient(180deg, #ff8b6b, #d13f2e); }
.edad-pct { font-size: clamp(.66rem, 1.1vw, .82rem); font-weight: 800; font-variant-numeric: tabular-nums; }
.edad-t { font-size: clamp(.55rem, .92vw, .68rem); color: var(--tinta-tenue); text-align: center; }

/* ============================================================
   P22 · FARMACIA
   ============================================================ */
.farmacia-flujo { position: relative; padding: clamp(.5rem, 1.3vw, .9rem); border-radius: var(--radio); border: 1px solid var(--linea); background: rgba(255,255,255,.035); overflow: hidden; }
.pastillas { position: absolute; inset: 0; pointer-events: none; }
.pastilla {
  position: absolute; top: 50%; left: -2rem; font-size: 1.1rem; opacity: .55;
  animation: pastillaVuela 7s linear infinite; animation-delay: calc(var(--pd) * 1ms);
}
@keyframes pastillaVuela {
  0% { left: -2rem; opacity: 0; transform: translateY(-50%) rotate(0deg); }
  10% { opacity: .55; }
  90% { opacity: .55; }
  100% { left: 102%; opacity: 0; transform: translateY(-50%) rotate(240deg); }
}

/* ============================================================
   P23 · PQRS
   ============================================================ */
.pqrs-entrada { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.canales { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
.canal {
  padding: .35rem .75rem; border-radius: 999px;
  border: 1px solid var(--linea); background: var(--tarjeta);
  font-size: clamp(.64rem, 1.05vw, .8rem); font-weight: 600; color: var(--tinta-suave);
  opacity: 0; animation: canalEntra 560ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--cd) * 1ms + 200ms);
}
@keyframes canalEntra { from { opacity: 0; transform: translateY(-.6rem); } to { opacity: 1; transform: none; } }
.canal-conv { display: flex; flex-direction: column; align-items: center; }
.conv-flecha { color: var(--acento); font-size: 1.2rem; animation: bajar 1.8s ease-in-out infinite; }
@keyframes bajar { 0%,100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(.35rem); opacity: 1; } }
.conv-nova { width: clamp(3rem, 8vw, 5rem); aspect-ratio: 1; }

/* ============================================================
   P24 · GERENCIA
   ============================================================ */
.gerencia { display: flex; flex-direction: column; align-items: center; gap: .35rem; }
.ger-fuentes { display: flex; flex-wrap: wrap; gap: .3rem; justify-content: center; }
.ger-f {
  padding: .3rem .65rem; border-radius: .4rem; font-size: clamp(.6rem, 1vw, .74rem); font-weight: 600;
  background: var(--tarjeta); border: 1px solid var(--linea); color: var(--tinta-suave);
  opacity: 0; animation: canalEntra 520ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--gd) * 1ms + 200ms);
}
.ger-conv { display: flex; align-items: center; gap: .5rem; font-size: clamp(.66rem, 1.15vw, .85rem); color: var(--acento-2); font-weight: 700; letter-spacing: .05em; }
.ger-conv span { color: var(--acento); }
.tablero { width: 100%; }
.tablero-fila { display: grid; grid-template-columns: repeat(3, 1fr) 1.3fr; gap: clamp(.5rem, 1.4vw, 1.1rem); align-items: center; }

.escala { display: flex; align-items: stretch; gap: .3rem; flex-wrap: wrap; justify-content: center; }
.escala-item {
  flex: 1 1 0; min-width: 8rem;
  padding: clamp(.5rem, 1.2vw, .85rem); border-radius: var(--radio-s);
  border: 1px solid var(--linea); background: var(--tarjeta);
  display: flex; flex-direction: column; gap: .2rem; position: relative;
}
.escala-n {
  width: 1.15rem; height: 1.15rem; border-radius: 999px; display: grid; place-items: center;
  background: var(--acento); color: #05070f; font-size: .58rem; font-weight: 800;
}
.escala-item h3 { margin: 0; font-size: clamp(.72rem, 1.2vw, .88rem); font-weight: 800; }
.escala-item p { margin: 0; font-size: clamp(.6rem, .98vw, .73rem); color: var(--tinta-suave); }
.escala-ej { font-size: .58rem; color: var(--acento-2); font-style: italic; margin-top: auto; padding-top: .28rem; border-top: 1px dashed var(--linea); }
.escala-flecha { align-self: center; color: var(--tinta-tenue); }

/* ============================================================
   P25 · COLOMBIA EN CIFRAS
   ============================================================ */
.rotulo-ind { font-size: clamp(.66rem, 1.05vw, .8rem); font-weight: 700; color: var(--tinta); }
.valor-ind {
  font-size: clamp(1.4rem, 3.4vw, 2.6rem); font-weight: 800; letter-spacing: -.035em; line-height: 1;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(100deg, var(--acento), var(--acento-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.detalle-ind { margin: 0; font-size: clamp(.62rem, 1vw, .74rem); color: var(--tinta-suave); }
.tarjeta--vacia { border-style: dashed; justify-content: center; }
.tarjeta--cautela { border-color: color-mix(in srgb, var(--acento-3) 50%, transparent); }

/* ============================================================
   P26 · MAPA
   ============================================================ */
.mapa-bloque { display: grid; grid-template-columns: 1fr 1.25fr; gap: clamp(.6rem, 2vw, 1.6rem); align-items: center; }
.mapa-caja { display: flex; flex-direction: column; align-items: center; gap: .3rem; }
.mapa-svg { width: 100%; height: clamp(9rem, 52vh, 30rem); }
.dep {
  fill: color-mix(in srgb, var(--acento-2) 16%, transparent);
  stroke: var(--acento-2); stroke-width: 1.4; stroke-linejoin: round;
  opacity: 0; animation: depEntra 700ms cubic-bezier(.16,.84,.3,1) both;
  animation-delay: calc(var(--dd) * 1ms + 150ms);
  transition: fill .3s ease;
}
.dep:hover { fill: color-mix(in srgb, var(--acento) 40%, transparent); }
@keyframes depEntra { from { opacity: 0; transform: translateY(6px); } to { opacity: .95; transform: none; } }
.mapa-g { transform-origin: center; }
.mapa-fuente { text-align: center; max-width: 30ch; }
.mapa-txt { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(.4rem, 1vw, .8rem); }

/* ============================================================
   P27 · CASOS
   ============================================================ */
.caso { align-items: flex-start; }
.caso h3 { margin-top: .1rem; }

/* ============================================================
   P28 · MARCO NORMATIVO
   ============================================================ */
.marco-cols { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: clamp(.5rem, 1.4vw, 1rem); }
.marco-col {
  padding: clamp(.55rem, 1.3vw, .95rem); border-radius: var(--radio);
  border: 1px solid var(--linea); background: var(--tarjeta);
  display: flex; flex-direction: column; gap: .4rem;
}
.marco-col--vigente { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.marco-col--politica { border-color: color-mix(in srgb, var(--acento-2) 45%, transparent); }
.marco-col--proyecto { border-color: color-mix(in srgb, var(--acento-3) 45%, transparent); border-style: dashed; }
.marco-eti { font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--tinta-suave); }
.marco-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.2rem, 1fr)); gap: .26rem; }
.norma-min {
  padding: .35rem .55rem; border-radius: .4rem;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; gap: .1rem;
}
.norma-min b { font-size: clamp(.62rem, 1vw, .75rem); }
.norma-min--dest { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 14%, transparent); }
.norma-tema { font-size: .56rem; color: var(--tinta-tenue); }
.marco-nota { margin: 0; font-size: .6rem; color: var(--tinta-tenue); line-height: 1.35; }

.principios {
  display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .4rem;
}
.principios span {
  padding: .4rem .65rem; border-radius: var(--radio-s);
  border: 1px solid var(--linea); background: var(--tarjeta);
  font-size: clamp(.6rem, .98vw, .73rem); color: var(--tinta-suave); line-height: 1.35;
}
.principios b { display: block; color: var(--tinta); font-size: clamp(.65rem, 1.05vw, .78rem); }

.lista--dos { grid-template-columns: repeat(2, minmax(0,1fr)); }
.lista--dos li { font-size: clamp(.6rem, .95vw, .72rem); }

/* ============================================================
   P29 · RIESGOS
   ============================================================ */
.riesgo {
  padding: clamp(.35rem, .9vw, .6rem) clamp(.45rem, 1.1vw, .72rem); border-radius: var(--radio-s);
  border: 1px solid color-mix(in srgb, var(--alerta) 32%, transparent);
  background: color-mix(in srgb, var(--alerta) 7%, rgba(255,255,255,.03));
  display: flex; flex-direction: column; gap: .12rem;
}
.riesgo-i { color: var(--acento-2); font-size: .72rem; line-height: 1; }
.riesgo b { font-size: clamp(.64rem, 1.02vw, .78rem); }
.riesgo p { margin: 0; font-size: clamp(.55rem, .9vw, .68rem); color: var(--tinta-suave); line-height: 1.3; }

.hitl {
  padding: clamp(.5rem, 1.3vw, .9rem); border-radius: var(--radio); text-align: center;
  background: linear-gradient(100deg, color-mix(in srgb, var(--ok) 18%, transparent), color-mix(in srgb, var(--acento-2) 10%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 40%, transparent);
  display: flex; flex-direction: column; gap: .2rem; align-items: center;
}
.hitl-eti { font-size: .6rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 800; color: var(--ok); }
.hitl-txt { margin: 0; font-size: clamp(.9rem, 2vw, 1.35rem); font-weight: 800; letter-spacing: -.02em; }
.hitl-sub { margin: 0; font-size: clamp(.66rem, 1.05vw, .8rem); color: var(--tinta-suave); max-width: 70ch; }

/* ============================================================
   P30 · ALUCINACIÓN
   ============================================================ */
.alucina { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(.6rem, 1.8vw, 1.4rem); align-items: center; }
.alucina-chat { display: flex; flex-direction: column; gap: .45rem; }
.chat-pregunta { margin: 0; font-size: clamp(.68rem, 1.1vw, .82rem); color: var(--tinta-suave); }
.chat-respuesta {
  position: relative; padding: clamp(.6rem, 1.4vw, 1rem);
  border-radius: var(--radio); border: 1px solid var(--linea); background: rgba(255,255,255,.05);
}
.chat-quien { font-size: .58rem; letter-spacing: .16em; text-transform: uppercase; color: var(--acento-2); font-weight: 800; }
.chat-txt { margin: .3rem 0 0; font-size: clamp(.68rem, 1.12vw, .84rem); line-height: 1.55; min-height: 5.2em; }
.sello {
  position: absolute; right: clamp(.4rem, 1.5vw, 1.2rem); bottom: clamp(.4rem, 1.2vw, .9rem);
  padding: .35rem .7rem; border-radius: .4rem; text-align: right;
  border: 2px solid var(--alerta); color: var(--alerta);
  background: color-mix(in srgb, var(--alerta) 12%, rgba(10,2,2,.6));
  transform: rotate(-7deg) scale(1.5); opacity: 0;
  transition: opacity 420ms ease, transform 520ms cubic-bezier(.2,1.4,.4,1);
  display: flex; flex-direction: column; gap: .05rem;
}
.sello.on { opacity: 1; transform: rotate(-7deg) scale(1); }
.sello-t { font-size: clamp(.72rem, 1.3vw, .95rem); font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
.sello-s { font-size: .52rem; font-weight: 600; opacity: .85; max-width: 22ch; }
.alucina-lecciones { display: flex; flex-direction: column; gap: .6rem; }
.neq { color: var(--alerta); margin: 0 .2em; }

/* ============================================================
   P31 · ECUACIÓN PERSONA + IA
   ============================================================ */
.ecuacion { display: flex; align-items: center; justify-content: center; gap: clamp(.5rem, 2vw, 1.6rem); flex-wrap: wrap; }
.eq-parte {
  display: flex; flex-direction: column; align-items: center; gap: .2rem;
  padding: clamp(.5rem, 1.4vw, 1rem) clamp(.8rem, 2vw, 1.6rem);
  border-radius: var(--radio); border: 1px solid var(--linea); background: var(--tarjeta);
  font-size: clamp(.74rem, 1.4vw, 1rem); font-weight: 700;
}
.eq-i { font-size: clamp(1.3rem, 3vw, 2.2rem); }
.eq-parte--ia { border-color: color-mix(in srgb, var(--acento) 50%, transparent); background: color-mix(in srgb, var(--acento) 12%, var(--tarjeta)); }
.eq-parte--ia .eq-i { color: var(--acento-2); }
.eq-parte--res { border: 0; background: linear-gradient(100deg, color-mix(in srgb, var(--acento) 22%, transparent), color-mix(in srgb, var(--acento-2) 16%, transparent)); }
.eq-parte--res b { font-size: clamp(.95rem, 2.4vw, 1.7rem); letter-spacing: -.02em; }
.eq-op { font-size: clamp(1rem, 2.6vw, 1.9rem); font-weight: 300; color: var(--tinta-tenue); }

/* ============================================================
   P32 · RUTA
   ============================================================ */
.ruta { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: .4rem; }
.ruta-paso {
  padding: clamp(.5rem, 1.2vw, .85rem); border-radius: var(--radio-s);
  border: 1px solid var(--linea); background: var(--tarjeta);
  display: flex; flex-direction: column; gap: .22rem; position: relative;
}
.ruta-n {
  width: 1.35rem; height: 1.35rem; border-radius: 999px; display: grid; place-items: center;

/* ===== assets/js/fx.js ===== */
/* ============================================================
   FX · utilidades de animación
   Campo de partículas/nodos, contadores, barras, escritura
   progresiva y red neuronal generativa (portada).
   ============================================================ */
window.FX = (function () {
  "use strict";

  var reducido = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- utilidades de color ---------- */
  function leerVar(nombre) {
    return getComputedStyle(document.documentElement).getPropertyValue(nombre).trim() || "#6ea8ff";
  }
  function aRGB(hex) {
    hex = hex.replace("#", "");
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    var n = parseInt(hex, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function mezcla(a, b, t) {
    return [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t)];
  }
  function rgba(c, a) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; }

  /* ============================================================
     CAMPO DE FONDO: nodos y conexiones (metáfora de red / datos)
     ============================================================ */
  function iniciarCampo(canvas) {
    if (!canvas || reducido) return null;
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var nodos = [], w = 0, h = 0, raf = null;
    var colA = aRGB(leerVar("--p1")), colB = aRGB(leerVar("--p2"));
    var objA = colA.slice(), objB = colB.slice();

    function dimensionar() {
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var densidad = Math.round(Math.min(90, Math.max(26, (w * h) / 26000)));
      nodos = [];
      for (var i = 0; i < densidad; i++) {
        nodos.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22,
          r: Math.random() * 1.5 + 0.7, t: Math.random()
        });
      }
    }

    function pintar() {
      colA = mezcla(colA, objA, 0.045);
      colB = mezcla(colB, objB, 0.045);
      ctx.clearRect(0, 0, w, h);
      var lim = Math.min(w, h) * 0.16;

      for (var i = 0; i < nodos.length; i++) {
        var n = nodos[i];
        n.x += n.vx; n.y += n.vy;
        if (n.x < -20) n.x = w + 20; if (n.x > w + 20) n.x = -20;
        if (n.y < -20) n.y = h + 20; if (n.y > h + 20) n.y = -20;

        for (var j = i + 1; j < nodos.length; j++) {
          var m = nodos[j], dx = n.x - m.x, dy = n.y - m.y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < lim) {
            ctx.strokeStyle = rgba(mezcla(colA, colB, j / nodos.length), 0.1 * (1 - d / lim));
            ctx.lineWidth = 0.7;
            ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(m.x, m.y); ctx.stroke();
          }
        }
        var c = mezcla(colA, colB, n.t);
        ctx.fillStyle = rgba(c, 0.42);
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
      }
      raf = requestAnimationFrame(pintar);
    }

    dimensionar();
    pintar();
    window.addEventListener("resize", function () { cancelAnimationFrame(raf); dimensionar(); pintar(); });

    var api = {
      actualizarPaleta: function () { objA = aRGB(leerVar("--p1")); objB = aRGB(leerVar("--p2")); }
    };
    FXns.campo = api;
    return api;
  }

  /* ============================================================
     CONTADOR ANIMADO
     ============================================================ */
  function contador(el, destino, opc) {
    opc = opc || {};
    var dur = opc.duracion || 1400;
    var dec = opc.decimales || 0;
    var pre = opc.prefijo || "";
    var suf = opc.sufijo || "";
    if (reducido) { el.textContent = pre + formatear(destino, dec) + suf; return; }
    var t0 = null;
    function paso(t) {
      if (!t0) t0 = t;
      var p = Math.min((t - t0) / dur, 1);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = pre + formatear(destino * e, dec) + suf;
      if (p < 1) requestAnimationFrame(paso);
    }
    requestAnimationFrame(paso);
  }

  function formatear(n, dec) {
    return n.toLocaleString("es-CO", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

  /* Activa todos los [data-contador] dentro de una raíz */
  function activarContadores(raiz, retardo) {
    var els = raiz.querySelectorAll("[data-contador]");
    Array.prototype.forEach.call(els, function (el, i) {
      var v = parseFloat(el.getAttribute("data-contador"));
      var dec = parseInt(el.getAttribute("data-dec") || "0", 10);
      var pre = el.getAttribute("data-pre") || "";
      var suf = el.getAttribute("data-suf") || "";
      setTimeout(function () { contador(el, v, { decimales: dec, prefijo: pre, sufijo: suf }); },
        (retardo || 260) + i * 110);
    });
  }

  /* Activa todas las [data-pct] (barras) dentro de una raíz */
  function activarBarras(raiz, retardo) {
    var els = raiz.querySelectorAll("[data-pct]");
    Array.prototype.forEach.call(els, function (el, i) {
      setTimeout(function () { el.style.width = el.getAttribute("data-pct") + "%"; }, (retardo || 320) + i * 130);
    });
  }

  /* ============================================================
     ESCRITURA PROGRESIVA (texto que se construye)
     ============================================================ */
  function tipear(el, texto, opc) {
    opc = opc || {};
    var v = opc.velocidad || 26;
    if (reducido) { el.textContent = texto; if (opc.alTerminar) opc.alTerminar(); return function () {}; }
    el.textContent = "";
    var i = 0, id = null;
    function tic() {
      el.textContent = texto.slice(0, ++i);
      if (i < texto.length) { id = setTimeout(tic, v); }
      else if (opc.alTerminar) opc.alTerminar();
    }
    id = setTimeout(tic, opc.retardo || 0);
    return function () { clearTimeout(id); };
  }

  /* ============================================================
     RED NEURONAL QUE SE FORMA (portada)
     Puntos de datos dispersos que convergen en una arquitectura
     de capas y luego respiran.
     ============================================================ */
  function redNeuronal(canvas, opc) {
    if (!canvas) return function () {};
    opc = opc || {};
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0, raf = null, t0 = performance.now();
    var capas = opc.capas || [4, 7, 7, 3];
    var puntos = [], enlaces = [];

    function construir() {
      w = canvas.clientWidth; h = canvas.clientHeight;
      canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      puntos = []; enlaces = [];
      var mx = w * 0.12, my = h * 0.14;
      var paso = (w - mx * 2) / (capas.length - 1);
      var idx = 0, previos = [];
      for (var c = 0; c < capas.length; c++) {
        var n = capas[c], actuales = [];
        for (var i = 0; i < n; i++) {
          var y = my + (h - my * 2) * (n === 1 ? 0.5 : i / (n - 1));
          puntos.push({
            ox: Math.random() * w, oy: Math.random() * h,
            x: 0, y: 0, tx: mx + paso * c, ty: y,
            capa: c, retardo: 220 * c + Math.random() * 320, r: c === 0 || c === capas.length - 1 ? 3.4 : 2.9
          });
          actuales.push(idx++);
        }
        if (previos.length) {
          for (var a = 0; a < previos.length; a++)
            for (var b = 0; b < actuales.length; b++)
              enlaces.push([previos[a], actuales[b], Math.random()]);
        }
        previos = actuales;
      }
    }

    function pintar(t) {
      var ms = t - t0;
      ctx.clearRect(0, 0, w, h);
      var acento = aRGB(leerVar("--acento"));
      var acento2 = aRGB(leerVar("--acento-2"));

      for (var i = 0; i < puntos.length; i++) {
        var p = puntos[i];
        var pr = Math.max(0, Math.min(1, (ms - p.retardo) / 1500));
        var e = 1 - Math.pow(1 - pr, 4);
        p.x = p.ox + (p.tx - p.ox) * e;
        p.y = p.oy + (p.ty - p.oy) * e;
        p.listo = pr;
        if (pr >= 1) {
          p.y = p.ty + Math.sin((ms / 1400) + i) * 2.4;
        }
      }

      for (var k = 0; k < enlaces.length; k++) {
        var a = puntos[enlaces[k][0]], b = puntos[enlaces[k][1]];
        var vis = Math.min(a.listo, b.listo);
        if (vis <= 0.15) continue;
        var alfa = 0.07 + 0.1 * Math.abs(Math.sin(ms / 2400 + enlaces[k][2] * 6));
        ctx.strokeStyle = rgba(mezcla(acento, acento2, enlaces[k][2]), alfa * vis);
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }

      /* Impulsos que recorren la red una vez formada */
      if (ms > 1700) {
        for (var q = 0; q < 14; q++) {
          var en = enlaces[(q * 37) % enlaces.length];
          var pa = puntos[en[0]], pb = puntos[en[1]];
          var fase = ((ms / 1500) + en[2] * 3 + q * 0.13) % 1;
          var px = pa.x + (pb.x - pa.x) * fase, py = pa.y + (pb.y - pa.y) * fase;
          ctx.fillStyle = rgba(acento2, 0.85 * (1 - Math.abs(fase - 0.5) * 1.6));
          ctx.beginPath(); ctx.arc(px, py, 1.7, 0, 6.2832); ctx.fill();
        }
      }

      for (var j = 0; j < puntos.length; j++) {
        var pt = puntos[j];
        var col = pt.capa === 0 ? acento : pt.capa === capas.length - 1 ? acento2 : mezcla(acento, acento2, 0.5);
        var halo = pt.listo >= 1 ? 0.9 + Math.sin(ms / 900 + j) * 0.35 : 0.45;
        ctx.fillStyle = rgba(col, 0.16 * pt.listo);
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * (2.7 + halo), 0, 6.2832); ctx.fill();
        ctx.fillStyle = rgba(col, 0.42 + 0.5 * pt.listo);
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 6.2832); ctx.fill();
      }
      raf = requestAnimationFrame(pintar);
    }

    construir();
    if (reducido) {
      t0 = performance.now() - 4000;
      requestAnimationFrame(function (t) { pintar(t); cancelAnimationFrame(raf); });
    } else {
      raf = requestAnimationFrame(pintar);
    }
    var alRedim = function () { construir(); };
    window.addEventListener("resize", alRedim);
    return function () { cancelAnimationFrame(raf); window.removeEventListener("resize", alRedim); };
  }

  /* ============================================================
     SECUENCIA: revela elementos uno a uno con retardo
     ============================================================ */
  function secuencia(elems, intervalo, clase) {
    var ids = [];
    Array.prototype.forEach.call(elems, function (el, i) {
      ids.push(setTimeout(function () { el.classList.add(clase || "on"); }, i * (intervalo || 420)));
    });
    return function () { ids.forEach(clearTimeout); };
  }

  var FXns = {
    reducido: reducido,
    iniciarCampo: iniciarCampo,
    contador: contador,
    activarContadores: activarContadores,
    activarBarras: activarBarras,
    tipear: tipear,
    redNeuronal: redNeuronal,
    secuencia: secuencia,
    campo: null
  };
  return FXns;
})();

/* ============================================================
   PERSONAJES recurrentes de la capacitación
   - NOVA: la inteligencia artificial, representada como núcleo
     digital de nodos (no como robot humanoide).
   - Profesional clínico, profesional administrativo y paciente:
     siluetas neutras y respetuosas, diferenciadas por su función.
   ============================================================ */
window.PERSONAJES = (function () {
  "use strict";

  function envolver(contenido, clase, etiqueta) {
    return (
      '<figure class="personaje ' + (clase || "") + '" role="img" aria-label="' + etiqueta + '">' +
      '<div class="personaje-lienzo">' + contenido + "</div>" +
      '<figcaption>' + etiqueta + "</figcaption></figure>"
    );
  }

  /* ---------- NOVA: núcleo digital ---------- */
  function novaSVG(id) {
    id = id || "nova" + Math.random().toString(36).slice(2, 7);
    var nodos = "";
    for (var i = 0; i < 8; i++) {
      var ang = (Math.PI * 2 * i) / 8;
      var x = 50 + Math.cos(ang) * 33, y = 50 + Math.sin(ang) * 33;
      nodos +=
        '<line x1="50" y1="50" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) +
        '" stroke="var(--acento)" stroke-width="1" opacity=".45"/>' +
        '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.1" fill="var(--acento-2)">' +
        '<animate attributeName="opacity" values=".35;1;.35" dur="' + (2.4 + i * 0.22).toFixed(2) +
        's" repeatCount="indefinite"/></circle>';
    }
    return (
      '<svg class="svg-nova" viewBox="0 0 100 100" aria-hidden="true">' +
      '<defs><radialGradient id="' + id + '-g"><stop offset="0%" stop-color="var(--acento-2)" stop-opacity=".95"/>' +
      '<stop offset="60%" stop-color="var(--acento)" stop-opacity=".35"/>' +
      '<stop offset="100%" stop-color="var(--acento)" stop-opacity="0"/></radialGradient></defs>' +
      '<circle cx="50" cy="50" r="46" fill="url(#' + id + '-g)" opacity=".55"/>' +
      '<g class="nova-orbita">' +
      '<circle cx="50" cy="50" r="33" fill="none" stroke="var(--acento)" stroke-width="1" ' +
      'stroke-dasharray="4 7" opacity=".7"/></g>' +
      '<g class="nova-orbita nova-orbita--inv">' +
      '<circle cx="50" cy="50" r="22" fill="none" stroke="var(--acento-2)" stroke-width="1" ' +
      'stroke-dasharray="2 6" opacity=".8"/></g>' +
      nodos +
      '<circle cx="50" cy="50" r="11" fill="var(--acento-2)" opacity=".18"/>' +
      '<circle cx="50" cy="50" r="6.5" fill="var(--acento-2)">' +
      '<animate attributeName="r" values="6.5;8;6.5" dur="2.8s" repeatCount="indefinite"/></circle>' +
      "</svg>"
    );
  }

  /* ---------- Siluetas humanas ---------- */
  function base(accesorio, tono) {
    return (
      '<svg class="svg-persona" viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="47" fill="' + tono + '" opacity=".16"/>' +
      '<circle cx="50" cy="50" r="47" fill="none" stroke="' + tono + '" stroke-width="1.2" opacity=".6"/>' +
      '<circle cx="50" cy="38" r="13" fill="' + tono + '" opacity=".85"/>' +
      '<path d="M22 84c2-16 13-25 28-25s26 9 28 25z" fill="' + tono + '" opacity=".85"/>' +
      accesorio +
      "</svg>"
    );
  }

  function clinicoSVG() {
    /* fonendoscopio esquemático */
    var acc =
      '<path d="M40 60c0 9 5 14 10 14s10-5 10-14" fill="none" stroke="#04141a" stroke-width="2.4" ' +
      'stroke-linecap="round" opacity=".8"/>' +
      '<circle cx="60" cy="76" r="4.2" fill="#04141a" opacity=".8"/>';
    return base(acc, "var(--acento)");
  }

  function administrativoSVG() {
    var acc =
      '<rect x="38" y="62" width="24" height="20" rx="2.4" fill="#04101c" opacity=".78"/>' +
      '<path d="M42 68h16M42 73h16M42 78h10" stroke="var(--acento-2)" stroke-width="1.8" stroke-linecap="round"/>';
    return base(acc, "var(--acento-2)");
  }

  function pacienteSVG() {
    var acc =
      '<path d="M36 74h8l3-6 4 11 4-8 3 3h8" fill="none" stroke="#0b1a12" stroke-width="2.2" ' +
      'stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>';
    return base(acc, "var(--acento-3)");
  }

  return {
    novaSVG: novaSVG,
    nova: function (etiqueta) { return envolver(novaSVG(), "personaje--nova", etiqueta || "NOVA · la inteligencia artificial"); },
    clinico: function (etiqueta) { return envolver(clinicoSVG(), "personaje--clinico", etiqueta || "Profesional clínico"); },
    administrativo: function (etiqueta) { return envolver(administrativoSVG(), "personaje--admin", etiqueta || "Profesional administrativo"); },
    paciente: function (etiqueta) { return envolver(pacienteSVG(), "personaje--paciente", etiqueta || "Paciente"); },
    clinicoSVG: clinicoSVG,
    administrativoSVG: administrativoSVG,
    pacienteSVG: pacienteSVG
  };
})();
